<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<title>FUNAAB Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="logo.png">
<style>
:root{
  /* Deep green + white. All surfaces are solid. */
  --emerald:#0a5c3e; --emerald-deep:#064e3b; --forest:#03281b;
  --fresh:#34d399; --fresh-soft:#6ee7b7; --mist:#f1f8f4; --mint:#dcefe5;
  --line:rgba(6,78,59,.16); --ink:#03281b; --ink-soft:#4a6b5c; --white:#fff;
  --glass:#fff; --glass-strong:#fff;
  --shadow:0 8px 24px -14px rgba(3,40,27,.35), 0 2px 5px rgba(3,40,27,.06);
  --shadow-lift:0 20px 36px -18px rgba(3,40,27,.45), 0 4px 10px rgba(3,40,27,.08);
  --alert:#ef4444;
  --header-h:68px; --nav-h:72px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.02em;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fresh);outline-offset:2px;border-radius:10px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* surfaces: solid white, no blur */
.glass{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.glass-strong{background:#fff}
.header,.bottom-nav{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px -16px rgba(3,40,27,.45)}

/* header */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:50;border-radius:0 0 22px 22px;border-top:0}
.header .wrap{height:100%;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque';font-weight:800;font-size:1.12rem;color:var(--emerald-deep)}
.logo img{height:38px;width:auto;display:block}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--emerald);display:grid;place-items:center}
.logo-mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-radius:999px;background:var(--mist);border:1px solid var(--line);transition:box-shadow .2s,border-color .2s,background-color .2s}
.hdr-search:focus-within{background:#fff;border-color:var(--emerald);box-shadow:0 0 0 4px rgba(52,211,153,.25)}
.hdr-search input{flex:1;border:0;background:none;outline:0;min-width:0}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--emerald-deep);transition:background-color .18s,color .18s,transform .15s var(--ease)}
.icon-btn:hover{background:var(--mint)}
.icon-btn:active,.icon-btn.cur,.icon-btn[aria-expanded="true"]{background:var(--emerald);color:#fff}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:2px;right:0;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--emerald);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.icon-btn.cur .badge,.icon-btn:active .badge{background:#fff;color:var(--emerald);border-color:var(--emerald)}
.badge.pop{animation:pop .35s var(--ease)}
.dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--alert);border:2px solid #fff}
.uni-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--mint);color:var(--emerald-deep);font-weight:700;font-size:.85rem;transition:background-color .18s,color .18s,transform .15s var(--ease)}
.uni-chip:active,.uni-chip[aria-expanded="true"]{background:var(--emerald);color:#fff;transform:scale(.95)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--emerald);color:#fff;display:grid;place-items:center;font-weight:700;border:2px solid #fff;box-shadow:var(--shadow);transition:transform .15s var(--ease),box-shadow .2s}
.avatar:hover{box-shadow:var(--shadow-lift)}
.avatar:active,.avatar[aria-expanded="true"]{transform:scale(.92)}
.only-web{display:none!important}
.only-app{display:flex}

/* layout */
main{padding:calc(var(--header-h) + 22px) 0 calc(var(--nav-h) + 40px);min-height:100vh}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:10px}
.sec-head h2{font-size:1.45rem}
.link{color:var(--emerald);font-weight:700;font-size:.92rem}
.link:hover{text-decoration:underline}

/* buttons: solid */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,background-color .2s,color .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--emerald);color:#fff;box-shadow:0 8px 16px -10px rgba(3,40,27,.8)}
.btn-primary:hover{transform:translateY(-1px);background:var(--emerald-deep)}
.btn-primary:active{transform:scale(.96);background:var(--forest)}
.btn-primary:disabled{opacity:.55;transform:none;cursor:not-allowed}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--emerald-deep)}
.btn-ghost:hover{background:var(--mist)}
.btn-ghost:active{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn-block{width:100%}

/* hero: deep green, animated background, optional looping video */
.hero{display:grid;grid-template-columns:1fr;gap:10px;padding:22px 20px;border-radius:26px;overflow:hidden;position:relative;isolation:isolate;
  background:#052e20;border:0;color:#fff;min-height:0;align-content:center;box-shadow:var(--shadow-lift)}
.hero>.hero-copy,.hero>.hero-art{position:relative;z-index:2}
.hero h1{font-size:clamp(1.55rem,5.4vw,2.3rem);color:#fff}
.hero p{color:rgba(255,255,255,.82);margin:8px 0 14px;max-width:46ch;font-size:.95rem}
.hero-search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.hero-search:focus-within{border-color:var(--fresh);box-shadow:0 0 0 4px rgba(52,211,153,.3)}
.hero-search input{flex:1;border:0;outline:0;min-width:0;background:none;padding:8px 0;color:#000;-webkit-text-fill-color:#000;caret-color:#000}
.hero-search input::placeholder{color:#6b7f74;-webkit-text-fill-color:#6b7f74;opacity:1}
.hero-media{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#03281b 0%,#064e3b 60%,#0a5c3e 100%)}
.hero-media::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(3,40,27,.88) 0%,rgba(3,40,27,.55) 60%,rgba(3,40,27,.35) 100%)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.hero-video.ready{opacity:.75}
.hero-grid{position:absolute;inset:-60px;opacity:.9;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:52px 52px;animation:gridpan 7s linear infinite;will-change:transform}
@keyframes gridpan{to{transform:translate(52px,52px)}}
.orb{position:absolute;border-radius:50%;will-change:transform}
.orb.o1{width:340px;height:340px;right:-90px;top:-110px;background:#10b981;opacity:.28;filter:blur(60px);animation:orb1 14s ease-in-out infinite}
.orb.o2{width:280px;height:280px;left:-80px;bottom:-120px;background:#34d399;opacity:.2;filter:blur(60px);animation:orb2 17s ease-in-out infinite}
@keyframes orb1{50%{transform:translate(-70px,60px) scale(1.15)}}
@keyframes orb2{50%{transform:translate(90px,-50px) scale(1.2)}}
.floaters{position:absolute;inset:0;z-index:1}
.floaters span{position:absolute;bottom:-50px;left:var(--x);font-size:var(--s);opacity:0;animation:drift 11s linear infinite;animation-delay:var(--d);will-change:transform,opacity}
@keyframes drift{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.55}85%{opacity:.55}100%{transform:translateY(-440px) rotate(24deg);opacity:0}}
.live-pill{display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#d1fae5;font-size:.82rem;font-weight:600;margin-bottom:10px;max-width:100%}
.live-pill .pulse{position:relative;width:9px;height:9px;border-radius:50%;background:var(--fresh);flex:none}
.live-pill .pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fresh);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
#liveText{transition:opacity .25s,transform .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#liveText.swap{opacity:0;transform:translateY(5px)}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hero-tags small{color:#a7f3d0;font-weight:600;margin-right:2px}
.hero-tags button{padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;font-size:.82rem;transition:background-color .18s,color .18s,transform .12s}
.hero-tags button:hover{background:#fff;color:var(--emerald-deep)}
.hero-tags button:active{transform:scale(.95)}
.hero-stats{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
.hero-stats b{display:block;font-family:'Bricolage Grotesque';font-size:1.3rem;color:#fff;line-height:1.1}
.hero-stats small{color:#a7f3d0;font-size:.8rem}
.hero-art{display:none;position:relative;justify-self:center}
.hero-art svg{position:relative;width:100%;max-width:240px;height:auto;filter:drop-shadow(0 24px 24px rgba(0,0,0,.35));animation:float 5s ease-in-out infinite;will-change:transform}
.hero-art .ring{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:2px solid rgba(110,231,183,.5);animation:ripple 4.5s ease-out infinite;will-change:transform,opacity}
.hero-art .ring.r2{animation-delay:2.2s}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes float{50%{transform:translateY(-10px)}}


/* sliding info cards under the hero: endless loop, pauses on hover/touch */
.mq{margin-top:14px;overflow:hidden;position:relative;border-radius:22px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.mq-track{display:flex;width:max-content;animation:mqslide 42s linear infinite;will-change:transform}
.mq:hover .mq-track,.mq:focus-within .mq-track,.mq:active .mq-track{animation-play-state:paused}
@keyframes mqslide{to{transform:translateX(-50%)}}
.mq-card{flex:none;width:250px;margin-right:14px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;text-align:left;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s}
.mq-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.mq-card .mq-emo{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--mint)}
.mq-card b{display:block;font-family:'Bricolage Grotesque';font-size:1rem;line-height:1.15;color:var(--emerald-deep)}
.mq-card small{display:block;margin-top:3px;font-size:.8rem;line-height:1.3;color:var(--ink-soft)}
.mq-card.dk{background:var(--emerald-deep);border-color:transparent}
.mq-card.dk .mq-emo{background:rgba(255,255,255,.14)}
.mq-card.dk b{color:#fff}.mq-card.dk small{color:#a7f3d0}
.mq-card.mt{background:var(--mint)}
.mq-card.mt .mq-emo{background:#fff}
@media(min-width:1024px){.mq-card{width:290px}}

/* chips / categories */
.scroll-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-row::-webkit-scrollbar{display:none}
.cat{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;padding:14px 8px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:.8rem;text-align:center;transition:transform .2s var(--ease),box-shadow .2s,background-color .18s,color .18s}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.cat:active{transform:scale(.95);background:var(--emerald);color:#fff}
.cat .emo{font-size:1.9rem;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--mint)}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:.88rem;color:var(--emerald-deep);white-space:nowrap;transition:background-color .18s,color .18s,border-color .18s,transform .15s var(--ease)}
.chip:hover{background:var(--mint)}
.chip:active{transform:scale(.95)}
.chip.on,.chip:active{background:var(--emerald);border-color:var(--emerald);color:#fff}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.pcard:active{transform:scale(.98)}
.tile{aspect-ratio:1/1;display:grid;place-items:center;font-size:4rem;background:var(--mint);position:relative;cursor:pointer}
.tile>*{transition:transform .3s var(--ease)}
.pcard:hover .tile{font-size:4rem}
.tile.big{font-size:8rem;border-radius:28px;aspect-ratio:1/1}
.wish{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--emerald);background:#fff;border:1px solid var(--line);transition:transform .15s var(--ease),background-color .18s,color .18s}
.wish:active{transform:scale(.85)}
.wish.on{background:var(--emerald);color:#fff}
.wish.on svg{fill:#fff;animation:pop .35s var(--ease)}
.pinfo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pname{font-weight:700;font-size:.95rem;line-height:1.25}
.pstore{font-size:.8rem;color:var(--ink-soft)}
.price{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.1rem;color:var(--emerald-deep)}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.add{width:40px;height:40px;border-radius:13px;background:var(--emerald);color:#fff;display:grid;place-items:center;transition:transform .15s var(--ease),background-color .18s}
.add:hover{background:var(--emerald-deep)}
.add:active{transform:scale(.88)}
.add:disabled{background:#a7c4b7;cursor:not-allowed}
.add.done{animation:pop .35s var(--ease)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--mint);color:var(--emerald-deep)}
.tag.warn{background:#fff7e6;color:#8a5a00}
.tag.out{background:#eef1ef;color:#5a6b63}

/* stores */
.store{flex:none;width:230px;padding:16px;border-radius:22px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .2s var(--ease),background-color .18s}
.store:hover{transform:translateY(-3px)}
.store:active{transform:scale(.97);background:var(--mint)}
.store .emo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:var(--mint)}
.store b{display:block;font-size:.95rem}
.store small{color:var(--ink-soft)}

/* panels & forms */
.panel{border-radius:24px;padding:20px}
.promo{background:var(--emerald-deep);border:0;color:#fff}
.promo p{color:rgba(255,255,255,.8)}
.promo .btn-primary{background:#fff;color:var(--emerald-deep)}
.promo .btn-primary:hover{background:var(--mint)}
.row{display:flex;gap:14px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.88rem}
.field input,.field select,.sel{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.sel:focus{border-color:var(--emerald);box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.err{color:#b42318;font-size:.82rem;min-height:1em}
.empty{text-align:center;padding:48px 20px;border-radius:26px}
.empty .big{font-size:3.4rem}
.empty h3{margin:10px 0 6px;font-size:1.3rem}
.empty p{color:var(--ink-soft);margin-bottom:18px}

/* notifications */
.notifs{padding:8px}
.notif{display:flex;gap:12px;padding:14px;border-radius:16px}
.notif+.notif{border-top:1px solid var(--line)}
.notif.new{background:var(--mist)}
.notif .emo{width:44px;height:44px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:1.3rem;flex:none}
.notif p{color:var(--ink-soft);font-size:.9rem}
.notif small{color:var(--ink-soft);font-size:.78rem}

/* cart */
.cart-group{margin-bottom:16px}
.cart-group h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.citem{display:flex;gap:12px;align-items:center;padding:12px 0}
.citem .tile{width:64px;height:64px;font-size:2rem;border-radius:16px;flex:none;aspect-ratio:auto}
.citem .meta{flex:1;min-width:0}
.citem .meta b{display:block;font-size:.95rem}
.citem .meta small{color:var(--ink-soft)}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--mist);border-radius:12px;padding:3px}
.qty button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--emerald-deep);transition:background-color .15s,color .15s,transform .12s}
.qty button:hover{background:#fff}
.qty button:active{background:var(--emerald);color:#fff;transform:scale(.9)}
.qty span{min-width:26px;text-align:center;font-weight:700}
.summary-row{display:flex;justify-content:space-between;padding:6px 0}
.summary-row.total{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.25rem;margin-top:6px;padding-top:12px;border-top:1.5px dashed var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center;transition:background-color .18s,color .18s,border-color .18s,transform .12s}
.seg button:hover{background:var(--mist)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.two{display:grid;grid-template-columns:1fr;gap:18px}

/* orders */
.order{padding:18px;border-radius:22px;margin-bottom:14px}
.order-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.status{padding:4px 12px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--mint);color:var(--emerald-deep)}
.status.done{background:var(--emerald);color:#fff}
.steps{display:flex;gap:6px;margin:12px 0 4px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--mint);transition:background-color .4s}
.steps i.on{background:var(--emerald)}

/* layers: scrim, drawer, sheet, modal, dropdown (solid) */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,40,27,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.layer{position:fixed;z-index:70;visibility:hidden;transition:transform .3s var(--ease),opacity .25s,visibility 0s .3s;border:1px solid var(--line);box-shadow:var(--shadow-lift);background:#fff}
.layer.on{visibility:visible;transition:transform .3s var(--ease),opacity .25s}
.drawer{top:0;left:0;bottom:0;width:min(86vw,330px);padding:22px 16px;border-radius:0 28px 28px 0;transform:translateX(-102%);display:flex;flex-direction:column;gap:6px;overflow:auto}
.drawer.on{transform:none}
.menu-item{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;font-weight:600;width:100%;text-align:left;position:relative;transition:background-color .18s,color .18s,transform .12s}
.menu-item:hover{background:var(--mint);color:var(--emerald-deep)}
.menu-item:active,.menu-item.cur{background:var(--emerald);color:#fff}
.menu-item:active{transform:scale(.98)}
.menu-item .dot{position:static;margin-left:auto}
.sheet{left:0;right:0;bottom:0;padding:18px 16px calc(var(--nav-h) + 8px);border-radius:28px 28px 0 0;transform:translateY(105%)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.modal{left:50%;top:50%;width:min(92vw,460px);max-height:86vh;overflow:auto;padding:22px;border-radius:26px;transform:translate(-50%,-46%) scale(.97);opacity:0}
.modal.on{transform:translate(-50%,-50%);opacity:1}
.dropdown{top:calc(var(--header-h) - 6px);right:20px;width:240px;padding:10px;border-radius:20px;opacity:0;transform:translateY(-6px)}
.dropdown.on{opacity:1;transform:none}
.uni-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);margin-bottom:10px;width:100%;text-align:left;background:#fff;transition:background-color .18s,border-color .18s}
.uni-opt.on{border-color:var(--emerald);background:var(--mist)}
.uni-opt:not([disabled]):active{background:var(--mint)}
.uni-opt[disabled]{opacity:.55;cursor:not-allowed}
.who{padding:8px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.who b{display:block;font-size:.95rem}
.who small{color:var(--ink-soft);font-size:.8rem;word-break:break-all}

/* bottom nav (mobile app version) */
.bottom-nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:var(--nav-h);z-index:55;border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:.72rem;font-weight:600;color:var(--ink-soft);border-radius:18px;transition:color .18s}
.nav-btn .ico{position:relative;width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s,color .2s,transform .2s var(--ease)}
.nav-btn:hover .ico{background:var(--mint)}
.nav-btn:active .ico{background:var(--emerald);color:#fff;transform:scale(.9)}
.nav-btn.cur,.nav-btn[aria-expanded="true"]{color:var(--emerald-deep)}
.nav-btn.cur .ico,.nav-btn[aria-expanded="true"] .ico{background:var(--emerald);color:#fff}
.nav-btn.cur .ico svg{animation:pop .35s var(--ease)}
.nav-btn .badge{top:-4px;right:2px}
.nav-btn .dot{top:0;right:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 28px);transform:translate(-50%,20px);z-index:90;padding:12px 18px;border-radius:14px;background:var(--forest);color:#fff;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:.88rem;margin-bottom:14px}
.success{max-width:520px;margin:20px auto;text-align:center;padding:36px 24px;border-radius:30px}
.success .check{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--emerald);color:#fff;box-shadow:var(--shadow-lift);animation:pop .5s var(--ease) .15s both}
.success .check svg{width:42px;height:42px;stroke-width:2.6}

/* product detail layout */
.pd-grid{grid-template-columns:1fr}

/* ---------- motion (transform + opacity only) ---------- */
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view.enter>*{animation:rise .45s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.05s}
#view.enter>*:nth-child(3){animation-delay:.1s}
#view.enter>*:nth-child(4){animation-delay:.15s}
#view.enter>*:nth-child(n+5){animation-delay:.2s}
#view.enter .grid>.pcard{animation:rise .4s var(--ease) both;animation-delay:calc(min(var(--i,0),7)*45ms + 120ms)}
#view.enter .scroll-row>*{animation:rise .4s var(--ease) both;animation-delay:calc(min(var(--i,0),6)*40ms + 120ms)}

@media(min-width:640px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .hero{padding:28px}
}
@media(min-width:760px){.pd-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
@media(min-width:1024px){
  :root{--nav-h:0px}
  .only-web{display:flex!important}
  .only-app{display:none!important}
  .bottom-nav{display:none}
  main{padding-bottom:60px}
  .hero{grid-template-columns:1.15fr .85fr;padding:30px 44px;align-items:center;min-height:300px}
  .hero-art{display:block}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  .two{grid-template-columns:1.5fr 1fr;align-items:start}
  .toast{bottom:28px}
  .cat{width:112px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero-video{display:none}
  .mq{overflow-x:auto;-webkit-mask-image:none;mask-image:none;scrollbar-width:none}
  .mq::-webkit-scrollbar{display:none}
  .mq-track{width:auto}
  .mq-dup{display:none}
}

/* Demo order progress: each open order moves to its next step on a timer, with a notification. */
function stepNote(o){
  const st = DB.store(o.store), nm = st ? st.name : 'The vendor';
  return [null, `${nm} accepted order ${o.ref}`, `${nm} is preparing order ${o.ref}`,
    o.fulfil === 'delivery' ? `Order ${o.ref} is on the way` : `Order ${o.ref} is ready for pickup`, `Order ${o.ref} is complete`][o.step];
}
const STEP_EMO = ['','✅','👩‍🍳','🛵','🎉'];
setInterval(() => {
  const now = Date.now(); let changed = false;
  S.orders.forEach(o => {
    if (o.step >= 4) return;
    if (!o.at) o.at = now;
    if (now - o.at >= STEP_MS){
      o.step++; o.at = now; changed = true;
      const msg = stepNote(o);
      pushNotif(STEP_EMO[o.step], ORDER_STEPS[o.step], msg); toast(msg);
    }
  });
  if (!changed) return;
  save(); chrome(currentCur());
  const c = currentCur(); if (c === 'orders' || c === 'notifications') rerender();
}, 4000);

function countUp(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  $$('[data-count]').forEach(el => {
    const to = +el.dataset.count, sfx = el.dataset.suffix || '', t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + sfx; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function filteredProducts(){
  const q = S.q.trim().toLowerCase();
  let list = DB.products().filter(p => {
    const st = DB.store(p.store), c = DB.cat(p.cat);
    if (S.cat !== 'all' && p.cat !== S.cat) return false;
    if (S.stockOnly && p.stock <= 0) return false;
    if (S.min !== '' && p.price < +S.min) return false;
    if (S.max !== '' && p.price > +S.max) return false;
    if (!q) return true;
    return [p.name, p.desc, st.name, c[1]].join(' ').toLowerCase().includes(q);
  });
  if (S.sort === 'low') list.sort((a,b) => a.price - b.price);
  if (S.sort === 'high') list.sort((a,b) => b.price - a.price);
  return list;
}
function resultsHTML(){
  const list = filteredProducts();
  if (!list.length) return empty('🔎','No matches found','Try a different word, clear a filter, or browse a category.',

  return `<p style="color:var(--ink-soft);margin-bottom:12px">${list.length} item${list.length>1?'s':''}</p>${productGrid(list)}`;
}

function viewCategories(){ return `<h1 style="font-size:2rem;margin-bottom:16px">Categories</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${CATS.map(c => `<button class="cat" style="width:auto" data-cat="${c[0]}"><span class="emo">${c[2]}</span>${c[1]}</button>`).join('')}</div>`; }

function viewWishlist(){
  const list = S.wish.map(DB.product).filter(Boolean);
  return `<h1 style="font-size:2rem;margin-bottom:16px">Wishlist</h1>` + (list.length ? productGrid(list) :
    empty('💚','Nothing saved yet','Tap the heart on any product to keep it here.','<a class="btn btn-primary" href="#/explore">Find something</a>'));
}

function viewNotifications(){
  const html = `<h1 style="font-size:2rem;margin-bottom:16px">Notifications</h1>` + (S.notifs.length
    ? `<div class="panel glass notifs">${S.notifs.map(n => `<div class="notif ${n.read?'':'new'}"><div class="emo">${n.emo}</div><div><b>${esc(n.title)}</b><p>${esc(n.text)}</p><small>${timeAgo(n.t)}</small></div></div>`).join('')}</div>`
    : empty('🔔','No notifications yet','Order updates and vendor messages will appear here.'));
  S.notifs.forEach(n => n.read = true); save();
  return html;
}

/* ---- cart ---- */
function cartLines(){
  return Object.entries(S.cart).map(([k, qty]) => { const {id, v} = splitKey(k); const p = DB.product(id); return p ? {k, p, v, qty} : null; }).filter(Boolean);
}
function cartTotals(){ const lines = cartLines(); return { lines, subtotal: lines.reduce((a,l) => a + l.p.price * l.qty, 0) }; }
function groupByStore(lines){ const g = {}; lines.forEach(l => (g[l.p.store] = g[l.p.store] || []).push(l)); return g; }

function viewCart(){
  const {lines, subtotal} = cartTotals();
  if (!lines.length) return `<h1 style="font-size:2rem;margin-bottom:16px">Your cart</h1>` + empty('🛒','Your cart is empty','Add products from any store and they will appear here.','<a class="btn btn-primary" href="#/explore">Start shopping</a>');
  const groups = groupByStore(lines);
  return `<h1 style="font-size:2rem;margin-bottom:16px">Your cart</h1>
  <div class="two">
    <div>${Object.entries(groups).map(([sid, ls]) => { const st = DB.store(sid); return `
      <div class="panel glass cart-group"><h3><span>${st.emo}</span>${esc(st.name)}</h3>
        ${ls.map(l => `<div class="citem"><div class="tile">${l.p.emo}</div>
          <div class="meta"><b>${esc(l.p.name)}</b><small>${l.v?esc(l.v)+' · ':''}${naira(l.p.price)}</small>
            ${l.qty > l.p.stock ? `<div class="err">Only ${l.p.stock} available</div>` : ''}</div>
          <div class="qty"><button data-qty="${esc(l.k)}" data-d="-1" aria-label="Decrease">${ico('minus')}</button><span>${l.qty}</span><button data-qty="${esc(l.k)}" data-d="1" aria-label="Increase">${ico('plus')}</button></div>
          <button class="icon-btn" data-rm="${esc(l.k)}" aria-label="Remove ${esc(l.p.name)}">${ico('trash')}</button></div>`).join('')}
      </div>`; }).join('')}</div>
    <aside class="panel glass" style="position:sticky;top:calc(var(--header-h) + 16px)">
      <h3 style="margin-bottom:10px">Order summary</h3>
      <div class="summary-row"><span>Items</span><span>${cartCount()}</span></div>
      <div class="summary-row total"><span>Subtotal</span><span>${naira(subtotal)}</span></div>
      <p style="font-size:.8rem;color:var(--ink-soft);margin:8px 0 14px">Prices and stock are verified again when you pay.</p>
      <a class="btn btn-primary btn-block" href="#/checkout">Go to checkout</a>
    </aside>
  </div>`;
}

/* ---- checkout ---- */

  const {lines, subtotal} = cartTotals();
  if (!lines.length) return viewCart();
  const groups = groupByStore(lines);
  Object.keys(groups).forEach(sid => { if (!S.fulfil[sid]) S.fulfil[sid] = 'pickup'; });
  const needAddr = Object.keys(groups).some(sid => S.fulfil[sid] === 'delivery');
  return `<div class="crumbs"><a href="#/cart">Cart</a> › Checkout</div>
  <h1 style="font-size:2rem;margin-bottom:16px">Checkout</h1>
  <div class="two">
    <div>
      <div class="panel glass" style="margin-bottom:16px"><h3 style="margin-bottom:12px">Your details</h3>
        <div class="field"><label for="ckName">Full name</label><input id="ckName" autocomplete="name" value="${USER.name==='Student'?'':esc(USER.name)}"><div class="err" id="eName"></div></div>
        <div class="field"><label for="ckPhone">Phone number</label><input id="ckPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08012345678"><div class="err" id="ePhone"></div></div>
        <div class="field" id="addrField" ${needAddr?'':'hidden'}><label for="ckAddr">Delivery address</label><input id="ckAddr" placeholder="Hostel, room number or landmark"><div class="err" id="eAddr"></div></div>
      </div>
      ${Object.entries(groups).map(([sid, ls]) => { const st = DB.store(sid); const f = S.fulfil[sid]; return `
      <div class="panel glass" style="margin-bottom:16px"><h3 style="margin-bottom:10px">${st.emo} ${esc(st.name)}</h3>
        ${ls.map(l => `<div class="summary-row"><span>${l.qty} × ${esc(l.p.name)}${l.v?' ('+esc(l.v)+')':''}</span><span>${naira(l.p.price*l.qty)}</span></div>`).join('')}
        <b style="display:block;margin:12px 0 8px;font-size:.9rem">How do you want to get this order?</b>
        <div class="seg"><button data-ful="${sid}:pickup" class="${f==='pickup'?'on':''}">${ico('pin')} Pickup</button><button data-ful="${sid}:delivery" class="${f==='delivery'?'on':''}">${ico('truck')} Delivery</button></div>
        <p style="font-size:.8rem;color:var(--ink-soft);margin-top:8px">${f==='pickup'?'Arrange the pickup time and place with the vendor after you order.':'The vendor will confirm delivery details with you after you order.'}</p>
      </div>`; }).join('')}
    </div>
    <aside class="panel glass" style="position:sticky;top:calc(var(--header-h) + 16px)">
      <h3 style="margin-bottom:10px">Order summary</h3>
      <div class="summary-row"><span>Items (${cartCount()})</span><span>${naira(subtotal)}</span></div>
      <div class="summary-row total"><span>Total</span><span>${naira(subtotal)}</span></div>
      <p style="font-size:.8rem;color:var(--ink-soft);margin:8px 0 14px">The final amount is confirmed by our server before payment.</p>
      <button class="btn btn-primary btn-block" id="payBtn" data-pay>Pay ${naira(subtotal)}</button>
    </aside>
  </div>`;
}

/* The ONLY place that creates an order. In production this must run on the server:
   re-read prices/stock from the DB, create the order, then open Paystack with the
   server-computed amount and confirm via webhook. Never trust the browser total. */
async function placeOrder(){
  const name = $('#ckName').value.trim(), phone = $('#ckPhone').value.trim(), addr = ($('#ckAddr')||{value:''}).value.trim();
  const needAddr = Object.values(S.fulfil).includes('delivery');
  let bad = false;
  $('#eName').textContent = name ? '' : (bad = true, 'Enter your full name.');
  $('#ePhone').textContent = /^(\+?234|0)\d{10}$/.test(phone.replace(/\s/g,'')) ? '' : (bad = true, 'Enter a valid Nigerian phone number.');
  $('#eAddr').textContent = (!needAddr || addr) ? '' : (bad = true, 'Enter a delivery address.');
  if (bad) return;
  const {lines} = cartTotals();
  for (const l of lines){ if (l.qty > l.p.stock){ toast(`${l.p.name}: only ${l.p.stock} left. Update your cart.`); return; } }
  const btn = $('#payBtn'); btn.disabled = true; btn.textContent = 'Processing payment…';
  await new Promise(r => setTimeout(r, 1100));                      // ← replace with Paystack popup + server verification
  const refs = [];
  Object.entries(groupByStore(lines)).forEach(([sid, ls]) => {
    const ref = 'FM-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    S.orders.unshift({ ref, store:sid, fulfil:S.fulfil[sid], step:0, at:Date.now(), date:new Date().toISOString(), customer:{name,phone,addr},
      total: ls.reduce((a,l) => a + l.p.price*l.qty, 0),
      items: ls.map(l => ({ name:l.p.name, variant:l.v, qty:l.qty, price:l.p.price, emo:l.p.emo })) });
    ls.forEach(l => { l.p.stock = Math.max(0, l.p.stock - l.qty); });   // live stock for this session; the backend owns this later
    pushNotif('🧾', 'Order placed', `Order ${ref} was sent to ${DB.store(sid).name}.`);
    refs.push(ref);
  });
  S.cart = {}; S.fulfil = {}; save();
  location.hash = '#/success/' + refs.join(',');
}
function viewSuccess(refs){
  return `<div class="success glass"><div class="check">${ico('check')}</div>
    <h1 style="font-size:1.9rem;margin-bottom:8px">Payment successful</h1>
    <p style="color:var(--ink-soft);margin-bottom:6px">Your order has been placed. The vendor has been notified.</p>
    <p style="margin-bottom:22px"><b>Reference${refs.split(',').length>1?'s':''}:</b> ${esc(refs.split(',').join(', '))}</p>
    <div class="row" style="justify-content:center;flex-wrap:wrap"><a class="btn btn-primary" href="#/orders">Track my order</a><a class="btn btn-ghost" href="#/home">Keep shopping</a></div></div>`;
}

/* ---- orders ---- */
const ORDER_STEPS = ['Awaiting vendor','Accepted','Being prepared','Ready or on the way','Completed'];
function viewOrders(){
  if (!S.orders.length) return `<h1 style="font-size:2rem;margin-bottom:16px">My orders</h1>` + empty('🧾','No orders yet','Your orders and their progress will show up here.','<a class="btn btn-primary" href="#/explore">Start shopping</a>');
  return `<h1 style="font-size:2rem;margin-bottom:16px">My orders</h1>` + S.orders.map(o => { const st = DB.store(o.store);
    return `<article class="order glass"><div class="order-top"><div><b>${o.ref}</b><div style="font-size:.85rem;color:var(--ink-soft)">${esc(st?st.name:'')} · ${new Date(o.date).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})} · ${o.fulfil==='delivery'?'Delivery':'Pickup'}</div></div>
      <span class="status ${o.step>=4?'done':''}">${ORDER_STEPS[o.step]}</span></div>
      ${o.items.map(i => `<div class="summary-row"><span>${i.emo} ${i.qty} × ${esc(i.name)}${i.variant?' ('+esc(i.variant)+')':''}</span><span>${naira(i.price*i.qty)}</span></div>`).join('')}
      <div class="steps" aria-hidden="true">${[0,1,2,3,4].map(n => `<i class="${n<=o.step?'on':''}"></i>`).join('')}</div>
      <div class="summary-row total"><span>Total</span><span>${naira(o.total)}</span></div></article>`; }).join('');
}

const LATER = {
  messages:['💬','Messages','Chat with vendors about your orders. This arrives in a later phase.'],
  reviews:['⭐','Reviews','You will be able to review products after your orders are completed.'],
  settings:['⚙️','Settings','Edit profile, addresses and payment options. This arrives in a later phase.'],
  help:['🛟','Help Centre','Guides and support contact. This arrives in a later phase.'],
  vendor:['🏪','Become a vendor','Vendors have their own account. The vendor sign up is built next.']
};
function viewLater(k){ const d = LATER[k]; return empty(d[0], d[1], d[2], '<a class="btn btn-primary" href="#/home">Back to home</a>'); }

/* ============================================================
   ROUTER
   ============================================================ */
let enterT;
function route(keepScroll){
  const parts = (location.hash || '#/home').replace('#/','').split('/');
  const [page, arg] = parts;
  const v = $('#view');
  let html, cur = page;
  switch(page){
    case 'home': case '': html = viewHome(); cur = 'home'; break;
    case 'explore': html = viewExplore(); break;
    case 'product': html = viewProduct(arg); cur = 'explore'; break;
    case 'store': html = viewStore(arg); cur = 'explore'; break;
    case 'stores': html = viewStores(); break;
    case 'categories': html = viewCategories(); break;
    case 'wishlist': html = viewWishlist(); break;
    case 'notifications': html = viewNotifications(); break;
    case 'cart': html = viewCart(); break;
    case 'checkout': html = viewCheckout(); cur = 'cart'; break;
    case 'success': html = viewSuccess(arg || ''); cur = 'orders'; break;
    case 'orders': html = viewOrders(); break;
    default: html = LATER[page] ? viewLater(page) : viewHome(); if(!LATER[page]) cur='home';
  }
  v.classList.remove('enter');
  v.innerHTML = html;
  if (keepScroll !== true){          /* full page change: play entrance once */
    void v.offsetWidth;
    v.classList.add('enter');
    clearTimeout(enterT); enterT = setTimeout(() => v.classList.remove('enter'), 900);
    window.scrollTo(0, 0);
  }
  /* autoplay needs the muted property set from script on injected video */
  $$('video.hero-video', v).forEach(el => { el.muted = true; const pr = el.play(); if (pr && pr.catch) pr.catch(() => {}); });
  if (cur === 'home' && keepScroll !== true) countUp();
  const nm = {home:'Home',explore:'Explore',cart:'Cart',orders:'Orders',notifications:'Notifications'}[cur];
  document.title = (nm ? nm + ' · ' : '') + BRAND;
  closeLayers(true);
  chrome(cur);
}

/* header, nav and menus */
let lastCount = -1;
function chrome(cur){
  const n = cartCount(), unfinished = openOrders(), unread = S.notifs.some(x => !x.read);
  $$('[data-cartcount]').forEach(b => {
    b.textContent = n; b.hidden = !n;
    if (n && lastCount !== -1 && n !== lastCount){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
  lastCount = n;
  $$('[data-notifdot]').forEach(d => d.hidden = !unread);
  $$('[data-nav]').forEach(el => el.classList.toggle('cur', el.dataset.nav === cur));
  $('#bottomNav').innerHTML = NAV.map(([ic, label, href]) => {
    const cartB = ic === 'cart' && n ? `<span class="badge">${n}</span>` : '';
    const dot = (ic === 'orders' && unfinished) || (ic === 'more' && unfinished) ? '<span class="dot"></span>' : '';
    return href ? `<a class="nav-btn ${cur===ic?'cur':''}" href="${href}" ${cur===ic?'aria-current="page"':''}><span class="ico">${ico(ic)}${cartB}${dot}</span>${label}</a>`
                : `<button class="nav-btn" data-open="more" aria-haspopup="dialog" aria-expanded="false"><span class="ico">${ico(ic)}${dot}</span>${label}</button>`;
  }).join('');
  $('#drawerItems').innerHTML = DRAWER.map(([ic,label,href]) => `<a class="menu-item ${('#/'+cur)===href?'cur':''}" href="${href}" data-go="${href}">${ico(ic)}${label}${ic==='orders'&&unfinished?'<span class="dot"></span>':''}</a>`).join('')
    + `<button class="menu-item" data-logout>${ico('logout')}Log out</button>`;
  $('#moreItems').innerHTML = MORE.map(([ic,label,href]) => `<a class="menu-item ${('#/'+cur)===href?'cur':''}" href="${href}" data-go="${href}">${ico(ic)}${label}${ic==='orders'&&unfinished?'<span class="dot"></span>':''}</a>`).join('')
    + `<button class="menu-item" data-logout>${ico('logout')}Log out</button>`;
  $('#profileItems').innerHTML = [['star','Review','#/reviews'],['help','Help Centre','#/help'],['settings','Settings','#/settings']]
    .map(([ic,label,href]) => `<a class="menu-item ${('#/'+cur)===href?'cur':''}" role="menuitem" href="${href}" data-go="${href}">${ico(ic)}${label}</a>`).join('')
    + `<button class="menu-item" role="menuitem" data-logout>${ico('logout')}Log out</button>`;
}

/* layers: one open at a time, closed by backdrop, Esc, or choosing an item */
let lastFocus = null;
function openLayer(id, opener){
  closeLayers(true); lastFocus = document.activeElement;
  $('#scrim').classList.add('on');
  const el = $('#'+id); el.classList.add('on');
  $$(`[data-open="${id}"]`).forEach(b => b.setAttribute('aria-expanded','true'));
  const f = el.querySelector('a,button'); if (f) f.focus({preventScroll:true});
}
function closeLayers(keep){
  $$('.layer.on').forEach(l => l.classList.remove('on'));
  $$('[data-open][aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded','false'));
  $('#scrim').classList.remove('on');
  if (!keep && lastFocus && lastFocus.focus) { try{ lastFocus.focus({preventScroll:true}); }catch(e){} lastFocus = null; }
}

/* ============================================================
   EVENTS (delegated)
   ============================================================ */
function addToCart(id, variant, btn){
  const p = DB.product(id); if (!p) return;
  if (p.stock <= 0){ toast('This item is out of stock.'); return; }
  const k = keyOf(id, variant || (p.variants[0] || ''));
  const have = S.cart[k] || 0;
  if (have + 1 > p.stock){ toast(`Only ${p.stock} available.`); return; }
  S.cart[k] = have + 1; save(); chrome(currentCur()); toast(`${p.name} added to cart`);
  if (btn){ btn.classList.remove('done'); void btn.offsetWidth; btn.classList.add('done'); }
}
const currentCur = () => { const c = (location.hash.replace('#/','').split('/')[0]) || 'home'; return c === 'checkout' ? 'cart' : c === 'product' || c === 'store' ? 'explore' : c; };
const rerender = () => { const y = scrollY; route(true); scrollTo(0, y); };

async function logout(){
  closeLayers(true);
  toast('Signing out...');
  await AUTH.signOut();
  location.href = AUTH.SIGNIN_URL;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-close],[data-go],[data-add],[data-wish],[data-qty],[data-rm],[data-cat],[data-variant],[data-ful],[data-pay],[data-reset],[data-pickuni],[data-logout],[data-quick]');
  if (!t) { if (e.target.id === 'scrim') closeLayers(); return; }
  const d = t.dataset;
  if (d.open) return openLayer(d.open);
  if ('close' in d) return closeLayers();
  if (d.go){ closeLayers(true); if (location.hash !== d.go) location.hash = d.go; else route(); return; }
  if (d.add){ const v = 'usevariant' in d ? (S.variant[d.add] || (DB.product(d.add).variants[0] || '')) : ''; return addToCart(d.add, v, t); }
  if (d.wish){
    const i = S.wish.indexOf(d.wish), on = i === -1;
    on ? S.wish.push(d.wish) : S.wish.splice(i,1); save();
    toast(on ? 'Saved to wishlist' : 'Removed from wishlist');
    if (currentCur() === 'wishlist') return rerender();      /* update in place, no scroll jump */
    $$(`[data-wish="${d.wish}"]`).forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      const l = b.querySelector('.lbl'); if (l) l.textContent = on ? 'Saved' : 'Save'; });
    return;
  }
  if (d.qty){ const p = DB.product(splitKey(d.qty).id); const nq = (S.cart[d.qty]||0) + (+d.d);
    if (nq <= 0) delete S.cart[d.qty]; else if (nq > p.stock){ toast(`Only ${p.stock} available.`); return; } else S.cart[d.qty] = nq;
    save(); return rerender(); }
  if (d.rm){ delete S.cart[d.rm]; save(); return rerender(); }
  if (d.quick){ S.q = d.quick; S.cat = 'all'; if (location.hash === '#/explore') route(); else location.hash = '#/explore'; return; }
  if (d.cat){ S.cat = d.cat; S.q = ''; if (location.hash === '#/explore'){ updateResults(); const q = $('#exQ'); if (q) q.value = ''; } else location.hash = '#/explore'; return; }
  if (d.variant){ S.variant[d.pid] = d.variant; return rerender(); }
  if (d.ful){ const [sid, m] = d.ful.split(':'); S.fulfil[sid] = m; const vals = ['#ckName','#ckPhone','#ckAddr'].map(s => ($(s)||{}).value);
    rerender(); ['#ckName','#ckPhone','#ckAddr'].forEach((s,i) => { const el = $(s); if (el && vals[i]) el.value = vals[i]; }); return; }
  if ('pay' in d) return placeOrder();
  if ('reset' in d){ S.q=''; S.cat='all'; S.min=''; S.max=''; S.stockOnly=false; S.sort='rel'; return route(); }
  if (d.pickuni){ closeLayers(); toast(`${d.pickuni} marketplace selected`); return; }
  if ('logout' in d) return logout();
});

/* Search typing: wait for a short pause before re-filtering (keeps typing smooth) */
let inT;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id !== 'exQ' && id !== 'exMin' && id !== 'exMax') return;
  const val = e.target.value;
  clearTimeout(inT);
  inT = setTimeout(() => {
    if (id === 'exQ') S.q = val; else if (id === 'exMin') S.min = val; else S.max = val;
    updateResults();
  }, 120);
});
document.addEventListener('change', e => {
  if (e.target.id === 'exSort'){ S.sort = e.target.value; updateResults(); }
  if (e.target.id === 'exStock'){ S.stockOnly = e.target.checked; updateResults(); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'hdrSearch'){ e.preventDefault(); S.q = $('#hdrQ').value; S.cat = 'all'; location.hash === '#/explore' ? route() : (location.hash = '#/explore'); }
  if (f.matches('[data-searchform]')){ e.preventDefault(); S.q = f.q.value; S.cat = 'all'; location.hash = '#/explore'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLayers();
  if ((e.key === 'Enter') && e.target.matches('.store[data-go]')) e.target.click();
});

/* ============================================================
   BOOT
   ============================================================ */
if (!REDIRECTING){
  $('#ic-menu').outerHTML = ico('menu');
  $$('[data-ic]').forEach(el => el.outerHTML = ico(el.dataset.ic));
  $$('[data-logo]').forEach(el => el.innerHTML = logoHTML());
  $$('[data-uni]').forEach(el => el.textContent = UNI.code);
  $$('[data-username]').forEach(el => el.textContent = USER.name);
  $$('[data-useremail]').forEach(el => el.textContent = USER.email);
  $('[data-avatar]').textContent = USER.name.charAt(0).toUpperCase();
  addEventListener('hashchange', () => route());
  route();
}
</script>
