<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · FUNAAB Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --emerald-950:#032b20;--emerald-900:#064e3b;--emerald-700:#047857;--emerald-600:#059669;
  --fresh-500:#22c55e;--fresh-400:#4ade80;--fresh-200:#bbf7d0;--mint-100:#e6f7ec;--mint-50:#f3fbf6;
  --border:#d3eadc;--ink:#06281e;--ink-soft:#4b6b5d;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px -12px rgba(6,78,59,.18);
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--ink);background:#fff;line-height:1.5;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fresh-400);outline-offset:2px}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,40px);
  background:rgba(255,255,255,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.bar a.back{color:var(--emerald-900);font-weight:600;text-decoration:none}
.btn{border:1px solid var(--emerald-700);background:var(--emerald-700);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:.92rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--emerald-900)}
.btn[disabled]{opacity:.65;cursor:wait}
.btn.secondary{background:#fff;color:var(--emerald-900);border-color:var(--border)}
.btn.secondary:hover{background:var(--mint-50)}
.btn.small{padding:6px 12px;font-size:.84rem;border-radius:10px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.page{max-width:1120px;margin:0 auto;padding:26px clamp(16px,3vw,40px) 90px}
h1{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.1rem);letter-spacing:-.02em;line-height:1.15}
.lead{color:var(--ink-soft);margin:4px 0 18px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--border);background:#fff;border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--emerald-700);border-color:var(--emerald-700);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}

.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.list{overflow:visible}
.head,.prow{display:grid;grid-template-columns:minmax(0,2.6fr) 1fr .8fr 1.1fr auto;gap:14px;align-items:center;padding:13px 18px}
.head{color:var(--ink-soft);font-size:.84rem;font-weight:500;border-bottom:1px solid var(--border)}
.prow{border-top:1px solid var(--mint-100)}
.head+.prow{border-top:0}
.pname{display:flex;gap:12px;align-items:center;min-width:0}
.thumb{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--mint-100),var(--fresh-200));display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--emerald-700);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.pname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{color:var(--ink-soft)}
.price{font-weight:600;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-done{background:var(--fresh-200);color:var(--emerald-950)}
.b-progress{background:var(--mint-100);color:var(--emerald-900);border-color:var(--fresh-200)}
.b-off{background:#eef2ef;color:#5d6f66;border-color:#dde5e0}
.b-low{background:#fff;color:var(--emerald-900);border-color:var(--emerald-700)}
.acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;position:relative}
details.more{position:relative}
details.more summary{list-style:none;cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:.84rem;font-weight:600;background:#fff;color:var(--emerald-900)}
details.more summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:38px;z-index:10;min-width:190px;padding:6px;border-radius:14px;border:1px solid var(--border);
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -18px rgba(6,78,59,.45)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:9px;font-size:.92rem}
.menu button:hover{background:var(--mint-100)}
.menu hr{border:0;border-top:1px solid var(--mint-100);margin:4px 0}
.reason{grid-column:1/-1;font-size:.86rem;background:var(--mint-50);border:1px solid var(--fresh-200);border-radius:10px;padding:8px 12px}

.empty{text-align:center;padding:48px 16px;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.empty .btn{margin-top:14px}

.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600;border:1px solid var(--emerald-950);background:#fff;display:flex;justify-content:space-between;gap:10px}
.banner button{background:none;border:0;font-weight:600;color:var(--emerald-700)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--emerald-900);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 18px 30px -12px rgba(0,0,0,.4);z-index:90}

/* Drawer */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,43,32,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
.drawer{width:min(600px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(3,43,32,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border)}
.dh h2{font-family:var(--display);font-size:1.3rem;letter-spacing:-.01em}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:1.2rem;line-height:1}
.db{flex:1;overflow-y:auto;padding:20px 22px}
.df{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);background:#fff}
.sec{margin-bottom:22px}
.sec h3{font-family:var(--display);font-size:1.02rem;margin-bottom:10px}
.field{margin-bottom:14px}
label,.lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.help{font-size:.82rem;color:var(--ink-soft);margin-top:4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 13px;background:#fff}
input[type=text]:hover,textarea:hover,select:hover{border-color:var(--fresh-500)}
textarea{min-height:100px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.invalid{border-color:var(--emerald-950)!important;box-shadow:0 0 0 3px var(--fresh-200)}
.err{color:var(--emerald-950);font-size:.84rem;font-weight:600;margin-top:4px}
.naira{position:relative}
.naira span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.naira input{padding-left:30px}
.count{float:right;font-weight:400;color:var(--ink-soft);font-size:.8rem}

.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.th{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.th img{width:100%;height:100%;object-fit:cover}
.th .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:99px;border:0;background:rgba(3,43,32,.75);color:#fff;line-height:1}
.th .tg{position:absolute;left:5px;bottom:5px;font-size:.7rem;font-weight:600;border-radius:99px;padding:2px 8px;border:0;background:rgba(255,255,255,.85);color:var(--emerald-900)}
.add-img{aspect-ratio:1;border:1.5px dashed var(--fresh-500);border-radius:14px;background:var(--mint-50);color:var(--emerald-700);font-weight:600;font-size:.84rem}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:14px;cursor:pointer;font-weight:500}
.check:has(input:checked){background:var(--mint-100);border-color:var(--fresh-500)}
.check input{width:18px;height:18px;accent-color:var(--emerald-700);margin-top:3px;flex:none}
.check small{display:block;color:var(--ink-soft);font-weight:400}
.vrow{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:8px;margin-bottom:8px;align-items:start}
.vhead{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:8px;font-size:.8rem;color:var(--ink-soft);margin-bottom:4px}

.dlg{position:fixed;inset:0;z-index:95;background:rgba(3,43,32,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.dlg div{background:#fff;border-radius:22px;padding:24px;max-width:420px;width:100%;box-shadow:0 30px 60px -20px rgba(3,43,32,.6)}
.dlg h3{font-family:var(--display);font-size:1.2rem;margin-bottom:6px}
.dlg p{color:var(--ink-soft);margin-bottom:18px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;background:none;padding:0;box-shadow:none;border-radius:0}

.gate{max-width:520px;margin:14vh auto;text-align:center;padding:0 20px}
.gate h1{margin-bottom:8px}.gate p{color:var(--ink-soft);margin-bottom:20px}
.skeleton{border-radius:16px;background:linear-gradient(90deg,var(--mint-100),var(--mint-50),var(--mint-100));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:760px){
  .head{display:none}
  .prow{grid-template-columns:1fr auto;gap:8px 12px}
  .prow .pname{grid-column:1/-1}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .two{grid-template-columns:1fr}
  .vrow,.vhead{grid-template-columns:1fr 1fr}
  .vhead{display:none}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){.spin,.skeleton{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="page"><div class="skeleton" style="height:360px"></div></div></div>

<script>
/* =========================================================
   FUNAAB Marketplace · Product management (vendor)
   ---------------------------------------------------------
   Connect your backend by defining, BEFORE this script:

   window.FUNAAB_API = {
     loadProducts:     async () => [product],
     loadCategories:   async () => [{id,name}],        // optional
     saveProduct:      async (product) => savedProduct, // id null = create
     setProductStatus: async (id, status) => savedProduct,
     uploadImage:      async (file, 'product') => url
   }
   Throw Error('message') to show a message to the vendor.
   Throw Object.assign(new Error(), {code:'forbidden'}) when the
   user is not an approved vendor.

   product = { id, name, description, categoryId, price, stock,
     lowStockAt, status, images:[url], variationType,
     variations:[{label,price,stock}], rejectionReason, updatedAt }

   status: draft | pending_review | published | paused |
           out_of_stock | rejected | archived

   Preview with no backend:  vendor-products.html?demo=1

   SECURITY: this page only validates for convenience. Your
   backend must re-check the vendor role, that the product
   belongs to the vendor's store, all prices and stock numbers,
   image type and size, and whether moderation is required
   (publishing may return status 'pending_review'). Archiving
   must hide the product everywhere (store, search, listings)
   and the backend may refuse it, e.g. when orders are open.
   ========================================================= */

const NGN=new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=['image/jpeg','image/png','image/webp'],MAX_IMG=3*1024*1024,MAX_IMGS=5;
const STATUS={draft:['Draft','b-progress'],pending_review:['Pending review','b-progress'],published:['Published','b-done'],paused:['Paused','b-off'],out_of_stock:['Out of stock','b-low'],rejected:['Rejected','b-off'],archived:['Archived','b-off']};
const DEFAULT_CATS=['Food and Snacks','Fashion and Clothing','Electronics and Gadgets','Books and Educational Materials','Beauty and Personal Care','Groceries','Home and Household Essentials','Printing and Design','Laundry and Cleaning','Other Products and Services'].map(n=>({id:n.toLowerCase().replace(/[^a-z]+/g,'-'),name:n}));
const app=document.getElementById('app');
const DEMO=new URLSearchParams(location.search).has('demo');

/* ---------- Demo backend ---------- */
const mem={};
const kv={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const KEY='funaab_demo_products';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const readDemo=()=>{const raw=kv.get(KEY);if(raw)return JSON.parse(raw);
  const seed=[
    {id:'p1',name:'Jollof rice pack',description:'Party-style jollof rice with fried plantain.',categoryId:'food-and-snacks',price:1800,stock:24,lowStockAt:10,status:'published',images:[],variationType:'',variations:[]},
    {id:'p2',name:'Fried rice pack',description:'Fried rice with chicken and coleslaw.',categoryId:'food-and-snacks',price:2000,stock:6,lowStockAt:10,status:'published',images:[],variationType:'',variations:[]},
    {id:'p3',name:'Meat pie',description:'Freshly baked each morning.',categoryId:'food-and-snacks',price:700,stock:0,lowStockAt:12,status:'out_of_stock',images:[],variationType:'',variations:[]},
    {id:'p4',name:'Chilled zobo',description:'Homemade zobo drink, served cold.',categoryId:'food-and-snacks',price:500,stock:40,lowStockAt:10,status:'draft',images:[],variationType:'Size',variations:[{label:'500ml',price:500,stock:25},{label:'1 litre',price:900,stock:15}]}];
  kv.set(KEY,JSON.stringify(seed));return seed};
const writeDemo=l=>kv.set(KEY,JSON.stringify(l));
const demoApi={
  async loadProducts(){await wait(250);return readDemo()},
  async loadCategories(){return DEFAULT_CATS},
  async saveProduct(p){await wait(500);const list=readDemo();
    let s={...p,updatedAt:Date.now()};
    if(s.status==='published'&&s.stock===0)s.status='out_of_stock';
    if(s.id){const i=list.findIndex(x=>x.id===s.id);list[i]=s}else{s.id='p'+Date.now();list.unshift(s)}
    writeDemo(list);return s},
  async setProductStatus(id,status){await wait(300);const list=readDemo();const p=list.find(x=>x.id===id);
    if(status==='published'){if(!p.images.length)throw new Error('Add at least one image before publishing.');if(p.stock===0)status='out_of_stock'}
    p.status=status;p.updatedAt=Date.now();writeDemo(list);return p},
  uploadImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read the image.'));r.readAsDataURL(file)})}
};
const api=window.FUNAAB_API?.loadProducts?window.FUNAAB_API:(DEMO?demoApi:null);

/* ---------- State ---------- */
let P=[],cats=DEFAULT_CATS,filter='all',q='',F=null,pending=[],dirty=false,saving=false,fileCtx=null;

const num=v=>{const s=String(v??'').replace(/[,\s₦]/g,'');return s===''?NaN:Number(s)};
const isInt=n=>Number.isInteger(n);
const catName=id=>cats.find(c=>c.id===id)?.name||'';

/* ---------- List ---------- */
function counts(){const live=P.filter(p=>p.status!=='archived');
  return {all:live.length,published:P.filter(p=>p.status==='published').length,draft:P.filter(p=>['draft','pending_review','rejected'].includes(p.status)).length,
    paused:P.filter(p=>p.status==='paused').length,out:P.filter(p=>p.status==='out_of_stock').length,archived:P.filter(p=>p.status==='archived').length}}
function visible(){
  return P.filter(p=>{
    const f=filter==='all'?p.status!=='archived':filter==='published'?p.status==='published':filter==='draft'?['draft','pending_review','rejected'].includes(p.status):filter==='paused'?p.status==='paused':filter==='out'?p.status==='out_of_stock':p.status==='archived';
    return f&&(!q||p.name.toLowerCase().includes(q.toLowerCase()));
  });
}
function row(p){
  const [lbl,cls]=STATUS[p.status]||[p.status,'b-progress'];
  const hasV=p.variations?.length;
  const price=hasV?'From '+NGN.format(Math.min(...p.variations.map(v=>v.price))):NGN.format(p.price);
  const low=p.stock>0&&p.stock<=p.lowStockAt&&['published','paused','draft'].includes(p.status);
  const img=p.images?.[0];
  let menu='';
  if(p.status==='archived')menu=`<button data-act="restore" data-id="${esc(p.id)}">Restore as draft</button>`;
  else{
    if(p.status!=='published'&&p.status!=='pending_review')menu+=`<button data-act="publish" data-id="${esc(p.id)}">Publish</button>`;
    if(p.status==='published')menu+=`<button data-act="pause" data-id="${esc(p.id)}">Pause listing</button><button data-act="unavail" data-id="${esc(p.id)}">Mark as unavailable</button>`;
    menu+=`<hr><button data-act="archive" data-id="${esc(p.id)}">Archive</button>`;
  }
  return `<div class="prow">
    <div class="pname"><div class="thumb">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:esc((p.name[0]||'?').toUpperCase())}</div>
      <div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(catName(p.categoryId)||'No category')}${hasV?` · ${p.variations.length} options`:''}</small></div></div>
    <div class="price">${price}</div>
    <div>${p.stock}${low?' <span class="badge b-low">Low</span>':''}</div>
    <div><span class="badge ${cls}">${lbl}</span></div>
    <div class="acts">${p.status!=='archived'?`<button class="btn secondary small" data-act="edit" data-id="${esc(p.id)}">Edit</button>`:''}
      <details class="more"><summary>More</summary><div class="menu">${menu}</div></details></div>
    ${p.status==='rejected'&&p.rejectionReason?`<div class="reason"><b>Not approved:</b> ${esc(p.rejectionReason)}</div>`:''}
  </div>`;
}
function renderList(){
  const c=counts(),list=visible();
  const chips=[['all','All',c.all],['published','Published',c.published],['draft','Drafts',c.draft],['paused','Paused',c.paused],['out','Out of stock',c.out],['archived','Archived',c.archived]];
  document.getElementById('chips').innerHTML=chips.map(([k,l,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${l}<em>${n}</em></button>`).join('');
  document.getElementById('list').innerHTML=list.length
    ?`<div class="head"><span>Product</span><span>Price</span><span>Stock</span><span>Status</span><span></span></div>${list.map(row).join('')}`
    :P.length===0?`<div class="empty"><b>No products yet</b>Add your first product to start selling.<br><button class="btn" data-act="new">Add product</button></div>`
    :`<div class="empty"><b>Nothing found</b>${q?'No product matches your search.':'No products in this view.'}</div>`;
}
function renderPage(){
  app.innerHTML=`
  <header class="bar"><a class="back" href="vendor-dashboard.html#/products">&larr; Dashboard</a><button class="btn" data-act="new">Add product</button></header>
  <div class="page"><h1>Products</h1><p class="lead">Create, edit and manage everything you sell.</p>
    <div id="banner"></div>
    <div class="tools"><input class="search" id="q" type="text" placeholder="Search your products" aria-label="Search your products" value="${esc(q)}"></div>
    <div class="chips" id="chips"></div>
    <div class="card list" id="list"></div></div><div id="layer"></div>`;
  renderList();
}

/* ---------- Form ---------- */
const blank=()=>({id:null,name:'',description:'',categoryId:'',price:'',stock:'',lowStockAt:'5',status:'draft',images:[],useVars:false,variationType:'',variations:[{label:'',price:'',stock:''}]});
function toForm(p){
  const hasV=!!(p.variations&&p.variations.length);
  return {id:p.id,name:p.name,description:p.description||'',categoryId:p.categoryId||'',price:hasV?'':String(p.price??''),stock:hasV?'':String(p.stock??''),lowStockAt:String(p.lowStockAt??5),
    status:p.status==='paused'?'paused':p.status==='draft'||p.status==='rejected'?'draft':'published',
    images:(p.images||[]).map(url=>({url,file:null})),useVars:hasV,variationType:p.variationType||'',
    variations:hasV?p.variations.map(v=>({label:v.label,price:String(v.price),stock:String(v.stock)})):[{label:'',price:'',stock:''}]};
}
function openForm(p){
  F=p?toForm(p):blank();dirty=false;
  document.getElementById('layer').innerHTML=`
  <div class="ov" id="ov"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div class="dh"><h2 id="dt">${F.id?'Edit product':'Add product'}</h2><button class="x" data-act="close" aria-label="Close">&times;</button></div>
    <div class="db" id="db">
      <div id="fbanner"></div>
      <div class="sec"><h3>Basic details</h3>
        <div class="field"><label for="f-name">Product name</label><input type="text" id="f-name" data-f="name" maxlength="80" value="${esc(F.name)}"><p class="err" data-err="name"></p></div>
        <div class="field"><label for="f-desc">Description <span class="count" id="cnt"></span></label><textarea id="f-desc" data-f="description" maxlength="1000">${esc(F.description)}</textarea><p class="err" data-err="description"></p></div>
        <div class="field"><label for="f-cat">Category</label><select id="f-cat" data-f="categoryId"><option value="">Choose a category</option>${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===F.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><p class="err" data-err="categoryId"></p></div>
      </div>
      <div class="sec"><h3>Images</h3><div id="imgs"></div><p class="help">Up to ${MAX_IMGS} images, JPG, PNG or WebP, 3 MB each. The first one is the main image.</p><p class="err" data-err="images"></p></div>
      <div class="sec"><h3>Price and stock</h3>
        <div id="basePS"></div>
        <label class="check"><input type="checkbox" id="useVars"><span>This product has options<small>Such as size, flavour or colour, each with its own price and stock.</small></span></label>
        <div id="vars"></div>
        <div class="field" style="margin-top:14px"><label for="f-low">Low-stock alert</label><input type="text" inputmode="numeric" id="f-low" data-f="lowStockAt" value="${esc(F.lowStockAt)}"><p class="help">You get an alert when stock drops to this number or lower.</p><p class="err" data-err="lowStockAt"></p></div>
      </div>
      <div class="sec"><h3>Listing</h3>
        <div class="field"><label for="f-status">Status</label><select id="f-status" data-f="status"><option value="draft">Draft (only you can see it)</option><option value="published">Published (visible to customers)</option><option value="paused">Paused (hidden for now)</option></select>
          <p class="help">Publishing may need a quick review before it goes live, depending on marketplace rules.</p></div></div>
    </div>
    <div class="df"><button class="btn secondary" data-act="close">Cancel</button><button class="btn" id="saveBtn" data-act="save">${F.id?'Save changes':'Add product'}</button></div>
  </div></div>`;
  document.getElementById('f-status').value=F.status;
  document.getElementById('useVars').checked=F.useVars;
  paintImgs();paintPS();paintVars();updCount();
  document.getElementById('f-name').focus();
}
function paintPS(){
  document.getElementById('basePS').innerHTML=F.useVars?'':`<div class="two"><div class="field"><label for="f-price">Price</label><div class="naira"><span>₦</span><input type="text" inputmode="decimal" id="f-price" data-f="price" value="${esc(F.price)}"></div><p class="err" data-err="price"></p></div>
    <div class="field"><label for="f-stock">Stock</label><input type="text" inputmode="numeric" id="f-stock" data-f="stock" value="${esc(F.stock)}"><p class="err" data-err="stock"></p></div></div>`;
}
function paintVars(){
  const el=document.getElementById('vars');
  if(!F.useVars){el.innerHTML='';return}
  el.innerHTML=`<div class="field" style="margin-top:14px"><label for="f-vt">Option type</label><input type="text" id="f-vt" data-f="variationType" maxlength="30" placeholder="e.g. Size" value="${esc(F.variationType)}"><p class="err" data-err="variationType"></p></div>
    <div class="vhead"><span>Option</span><span>Price (₦)</span><span>Stock</span><span></span></div>
    ${F.variations.map((v,i)=>`<div class="vrow"><input type="text" data-v="${i}" data-k="label" placeholder="e.g. Large" aria-label="Option name" value="${esc(v.label)}">
      <input type="text" inputmode="decimal" data-v="${i}" data-k="price" aria-label="Option price" value="${esc(v.price)}">
      <input type="text" inputmode="numeric" data-v="${i}" data-k="stock" aria-label="Option stock" value="${esc(v.stock)}">
      <button class="x" type="button" data-rmv="${i}" aria-label="Remove option" ${F.variations.length===1?'disabled':''}>&times;</button></div>`).join('')}
    <button class="btn secondary small" type="button" data-addv>Add option</button><p class="err" data-err="variations"></p>`;
}
function paintImgs(){
  document.getElementById('imgs').innerHTML=`<div class="imgs">${F.images.map((im,i)=>`<div class="th"><img src="${esc(im.url)}" alt="Product image ${i+1}">
    <button class="rm" type="button" data-rmimg="${i}" aria-label="Remove image ${i+1}">&times;</button>
    ${i===0?'<span class="tg">Main</span>':`<button class="tg" type="button" data-mainimg="${i}">Make main</button>`}</div>`).join('')}
    ${F.images.length<MAX_IMGS?'<button class="add-img" type="button" data-addimg>Add image</button>':''}</div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>`;
}
const updCount=()=>{const c=document.getElementById('cnt');if(c)c.textContent=F.description.length+'/1000'};

/* ---------- Validation ---------- */
function validate(){
  const e={},strict=F.status!=='draft',n=F.name.trim();
  if(n.length<3||n.length>80)e.name='Product name must be 3 to 80 characters.';
  if(strict){
    if(F.description.trim().length<10)e.description='Write at least 10 characters so customers know what they are buying.';
    if(!F.categoryId)e.categoryId='Choose a category.';
    if(!F.images.length)e.images='Add at least one image to publish this product.';
  }
  const lw=num(F.lowStockAt);if(!isInt(lw)||lw<0||lw>100000)e.lowStockAt='Enter a whole number, 0 or more.';
  const okPrice=n=>!Number.isNaN(n)&&n>0&&n<=10000000&&Math.round(n*100)===n*100;
  if(F.useVars){
    if(strict||F.variationType.trim()){if(!F.variationType.trim())e.variationType='Name your options, for example Size.'}
    const labels=new Set();
    for(const v of F.variations){
      const l=v.label.trim().toLowerCase(),p=num(v.price),s=num(v.stock);
      if(!l){e.variations='Give every option a name.';break}
      if(labels.has(l)){e.variations='Two options have the same name.';break}labels.add(l);
      if(!okPrice(p)){e.variations='Every option needs a price above ₦0 (up to 2 decimals).';break}
      if(!isInt(s)||s<0||s>100000){e.variations='Stock must be a whole number, 0 or more.';break}
    }
  }else{
    const p=num(F.price),s=num(F.stock);
    if(strict||F.price.trim()){if(!okPrice(p))e.price='Enter a price above ₦0.'}
    if(strict||F.stock.trim()){if(!isInt(s)||s<0||s>100000)e.stock='Enter a whole number, 0 or more.'}
  }
  return e;
}
function showErrors(e){
  document.querySelectorAll('#ov [data-err]').forEach(el=>el.textContent=e[el.dataset.err]||'');
  document.querySelectorAll('#ov [data-f]').forEach(el=>el.classList.toggle('invalid',!!e[el.dataset.f]));
}

/* ---------- Save ---------- */
async function saveForm(){
  if(saving)return;
  const e=validate();showErrors(e);
  const fb=document.getElementById('fbanner');
  if(Object.keys(e).length){fb.innerHTML='<div class="banner" role="alert">Please fix the highlighted fields and save again.</div>';
    (document.querySelector('#ov .invalid')||document.querySelector('#ov .err:not(:empty)'))?.scrollIntoView({behavior:'smooth',block:'center'});return}
  fb.innerHTML='';saving=true;
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving';
  try{
    const urls=[];
    for(const im of F.images)urls.push(im.file?await api.uploadImage(im.file,'product'):im.url);
    let price=num(F.price)||0,stock=num(F.stock)||0,variations=[];
    if(F.useVars){variations=F.variations.map(v=>({label:v.label.trim(),price:num(v.price),stock:num(v.stock)}));
      price=Math.min(...variations.map(v=>v.price));stock=variations.reduce((s,v)=>s+v.stock,0)}
    const saved=await api.saveProduct({id:F.id,name:F.name.trim(),description:F.description.trim(),categoryId:F.categoryId,price,stock,lowStockAt:num(F.lowStockAt),
      status:F.status,images:urls,variationType:F.useVars?F.variationType.trim():'',variations});
    const i=P.findIndex(p=>p.id===saved.id);if(i>-1)P[i]=saved;else P.unshift(saved);
    const isNew=!F.id;F=null;dirty=false;closeLayer();renderList();
    toast(saved.status==='pending_review'?'Saved. Waiting for review before it goes live.':isNew?'Product added':'Changes saved');
  }catch(err){
    fb.innerHTML=`<div class="banner" role="alert">${esc(err&&err.message?err.message:'We could not save this product. Check your connection and try again.')}</div>`;
    document.getElementById('db').scrollTo({top:0,behavior:'smooth'});
    btn.disabled=false;btn.textContent=F.id?'Save changes':'Add product';
  }finally{saving=false}
}

/* ---------- Helpers ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function closeLayer(){document.getElementById('layer').innerHTML=''}
function confirmDialog(title,text,label){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='dlg';
    d.innerHTML=`<div role="alertdialog" aria-modal="true" aria-labelledby="ct"><h3 id="ct">${esc(title)}</h3><p>${esc(text)}</p><span class="row"><button class="btn secondary" data-r="0">Cancel</button><button class="btn" data-r="1">${esc(label)}</button></span></div>`;
    d.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b||e.target===d){d.remove();res(b?b.dataset.r==='1':false)}});
    document.body.appendChild(d);d.querySelector('[data-r="1"]').focus();
  });
}
async function tryClose(){
  if(dirty&&!(await confirmDialog('Discard your changes?','You have changes that are not saved yet.','Discard')))return;
  F=null;dirty=false;closeLayer();
}
function bannerMsg(m){document.getElementById('banner').innerHTML=m?`<div class="banner" role="alert"><span>${esc(m)}</span><button data-act="dismiss">Dismiss</button></div>`:''}

async function setStatus(p,status,okMsg){
  bannerMsg('');
  try{const s=await api.setProductStatus(p.id,status);const i=P.findIndex(x=>x.id===s.id);P[i]=s;renderList();
    toast(s.status==='pending_review'&&status==='published'?'Sent for review':okMsg)}
  catch(err){bannerMsg(err&&err.message?err.message:'That did not work. Check your connection and try again.')}
}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
  if(!e.target.closest('details.more'))document.querySelectorAll('details.more[open]').forEach(d=>d.open=false);
  const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;renderList();return}
  if(e.target.id==='ov'){tryClose();return}
  if(e.target.closest('[data-addimg]')){document.getElementById('file').click();return}
  const rm=e.target.closest('[data-rmimg]');if(rm){F.images.splice(+rm.dataset.rmimg,1);paintImgs();dirty=true;return}
  const mn=e.target.closest('[data-mainimg]');if(mn){const [im]=F.images.splice(+mn.dataset.mainimg,1);F.images.unshift(im);paintImgs();dirty=true;return}
  if(e.target.closest('[data-addv]')){F.variations.push({label:'',price:'',stock:''});paintVars();dirty=true;return}
  const rv=e.target.closest('[data-rmv]');if(rv&&F.variations.length>1){F.variations.splice(+rv.dataset.rmv,1);paintVars();dirty=true;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,p=P.find(x=>x.id===b.dataset.id);
  if(act==='new')openForm(null);
  else if(act==='edit')openForm(p);
  else if(act==='close')tryClose();
  else if(act==='save')saveForm();
  else if(act==='dismiss')bannerMsg('');
  else if(act==='publish')setStatus(p,'published','Published');
  else if(act==='pause')setStatus(p,'paused','Listing paused');
  else if(act==='unavail')setStatus(p,'out_of_stock','Marked as unavailable');
  else if(act==='restore')setStatus(p,'draft','Restored as draft');
  else if(act==='archive'){
    if(await confirmDialog('Archive this product?',`"${p.name}" will disappear from your store, search and every listing. You can restore it later as a draft.`,'Archive'))setStatus(p,'archived','Product archived');
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;renderList();return}
  if(!F)return;
  if(t.dataset.v!==undefined){F.variations[+t.dataset.v][t.dataset.k]=t.value;dirty=true;return}
  if(t.dataset.f){F[t.dataset.f]=t.value;dirty=true;if(t.dataset.f==='description')updCount()}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!F)return;
  if(t.id==='useVars'){F.useVars=t.checked;paintPS();paintVars();dirty=true}
  else if(t.dataset.f==='categoryId'||t.dataset.f==='status'){F[t.dataset.f]=t.value;dirty=true}
  else if(t.id==='file'){addFiles([...t.files]);t.value=''}
});
function addFiles(files){
  const err=document.querySelector('#ov [data-err="images"]');err.textContent='';
  for(const f of files){
    if(F.images.length>=MAX_IMGS){err.textContent=`You can add up to ${MAX_IMGS} images.`;break}
    if(!TYPES.includes(f.type)){err.textContent='Use JPG, PNG or WebP images.';continue}
    if(f.size>MAX_IMG){err.textContent='One image was too large. The limit is 3 MB each.';continue}
    const r=new FileReader();r.onload=()=>{if(!F||F.images.length>=MAX_IMGS)return;F.images.push({url:r.result,file:f});paintImgs();dirty=true};r.readAsDataURL(f);
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&F&&!document.querySelector('.dlg'))tryClose()});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- Start ---------- */
function gate(t,x){app.innerHTML=`<div class="gate"><h1>${t}</h1><p>${x}</p><a class="btn" href="vendor-dashboard.html">Back to dashboard</a></div>`}
(async()=>{
  if(!api){gate('Products','This page is for approved vendors. Open it from your vendor dashboard.');return}
  try{
    P=await api.loadProducts();
    if(api.loadCategories){try{const c=await api.loadCategories();if(c&&c.length)cats=c}catch(e){}}
    renderPage();
  }catch(e){
    if(e&&e.code==='forbidden')gate('Vendor access needed','Only approved vendors can manage products.');
    else gate('We could not load your products','Check your connection and try again.');
  }
})();
</script>
</body>
</html>
