<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Dashboard · FUNAAB Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --emerald-950:#032b20;
  --emerald-900:#064e3b;
  --emerald-700:#047857;
  --emerald-600:#059669;
  --fresh-500:#22c55e;
  --fresh-400:#4ade80;
  --fresh-200:#bbf7d0;
  --mint-100:#e6f7ec;
  --mint-50:#f3fbf6;
  --border:#d3eadc;
  --ink:#06281e;
  --ink-soft:#4b6b5d;
  --white:#fff;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px -12px rgba(6,78,59,.18);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:var(--white);line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fresh-400);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;padding:22px 16px;color:#fff;
  background:
    radial-gradient(420px 300px at 0% 0%,rgba(74,222,128,.28),transparent 70%),
    linear-gradient(180deg,var(--emerald-900),var(--emerald-950));
  display:flex;flex-direction:column;gap:22px;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand-logo{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;box-shadow:0 6px 14px -4px rgba(0,0,0,.4)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--fresh-400),var(--emerald-600));display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.brand-mark svg{width:18px;height:18px}
.store-chip{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius-md);padding:12px;display:flex;gap:10px;align-items:center
}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--fresh-200);color:var(--emerald-900);display:grid;place-items:center;font-family:var(--display);font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.store-chip b{display:block;font-size:.95rem;line-height:1.2}
.store-chip small{color:var(--fresh-200);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:500;font-size:.95rem;transition:background .15s}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:#fff;color:var(--emerald-900);box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
.nav .count{margin-left:auto;background:var(--fresh-400);color:var(--emerald-950);font-size:.75rem;font-weight:600;border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ghost-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;text-decoration:none;font-weight:500;font-size:.92rem}
.ghost-btn:hover{background:rgba(255,255,255,.1)}

.main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em;line-height:1.15}
.top p{color:var(--ink-soft);font-size:.95rem}
.top-actions{display:flex;gap:10px;align-items:center;position:relative}
.btn{border:1px solid var(--emerald-700);background:var(--emerald-700);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--emerald-900)}
.btn.secondary{background:#fff;color:var(--emerald-900);border-color:var(--border)}
.btn.secondary:hover{background:var(--mint-50)}
.bell{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:#fff;display:grid;place-items:center}
.bell svg{width:20px;height:20px;color:var(--emerald-900)}
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--emerald-700);color:#fff;font-size:.7rem;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.panel-pop{
  position:absolute;right:0;top:52px;width:min(360px,88vw);z-index:20;
  background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 24px 50px -20px rgba(6,78,59,.4);padding:8px
}
.panel-pop h3{font-size:.9rem;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.panel-pop h3 button{background:none;border:0;color:var(--emerald-700);font-size:.82rem;font-weight:600}
.note{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:.9rem}
.note.unread{background:var(--mint-100)}
.note small{color:var(--ink-soft);display:block}

/* ---------- Cards ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.card h2{font-family:var(--display);font-size:1.1rem;letter-spacing:-.01em;margin-bottom:2px}
.card .sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:14px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr);margin:16px 0}
.cols{grid-template-columns:1.6fr 1fr}
.cols-2{grid-template-columns:1fr 1fr;margin-top:16px}
.stat{padding:18px}
.stat .label{color:var(--ink-soft);font-size:.88rem;display:flex;align-items:center;gap:8px}
.stat .label svg{width:18px;height:18px;color:var(--emerald-600)}
.stat .num{font-family:var(--display);font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .hint{font-size:.82rem;color:var(--ink-soft);margin-top:4px}

/* Hero (the one bold element) */
.hero{
  position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:28px clamp(20px,3vw,34px);
  min-height:220px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:
    radial-gradient(500px 260px at 90% 0%,rgba(74,222,128,.5),transparent 65%),
    linear-gradient(135deg,var(--emerald-700),var(--emerald-950));
  box-shadow:0 30px 50px -28px rgba(3,43,32,.7);
}
.hero .kicker{color:var(--fresh-200);font-weight:500;font-size:.95rem}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,5.5vw,3.8rem);letter-spacing:-.03em;line-height:1.05;margin:6px 0 10px;word-break:break-word}
.hero .meta{color:rgba(255,255,255,.8);font-size:.95rem;max-width:34ch}
.stack3d{perspective:900px;flex:none;width:170px;height:150px;position:relative}
.stack3d i{
  position:absolute;left:10px;width:140px;height:92px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transform:rotateX(58deg) rotateZ(-32deg);box-shadow:0 18px 26px -10px rgba(0,0,0,.45)
}
.stack3d i:nth-child(1){top:62px;background:linear-gradient(135deg,var(--fresh-400),var(--emerald-600))}
.stack3d i:nth-child(2){top:38px}
.stack3d i:nth-child(3){top:14px}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar .col{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--fresh-400),var(--emerald-600));min-height:4px;position:relative}
.bar .col.zero{background:var(--mint-100)}
.bar span{font-size:.78rem;color:var(--ink-soft)}
.bar em{font-style:normal;font-size:.72rem;color:var(--emerald-900);font-weight:600;white-space:nowrap}

/* Lists + tables */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--mint-100)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--ink-soft)}
.amount{font-weight:600;white-space:nowrap}
.table-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:500;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--mint-100);white-space:nowrap}
tr:last-child td{border-bottom:0}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid transparent}
.b-new{background:var(--emerald-700);color:#fff}
.b-progress{background:var(--mint-100);color:var(--emerald-900);border-color:var(--fresh-200)}
.b-done{background:var(--fresh-200);color:var(--emerald-950)}
.b-off{background:#eef2ef;color:#5d6f66;border-color:#dde5e0}
.b-low{background:#fff;color:var(--emerald-900);border-color:var(--emerald-700)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:#fff;border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--emerald-700);border-color:var(--emerald-700);color:#fff}

.empty{text-align:center;padding:30px 12px;color:var(--ink-soft)}
.empty svg{width:44px;height:44px;color:var(--fresh-500);margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:2px}

.gate{max-width:520px;margin:12vh auto;text-align:center;padding:0 20px}
.gate h1{font-family:var(--display);font-size:1.9rem;margin-bottom:8px}
.gate p{color:var(--ink-soft);margin-bottom:20px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--emerald-900);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:0 18px 30px -12px rgba(0,0,0,.4);z-index:50}

.skeleton{border-radius:12px;background:linear-gradient(90deg,var(--mint-100),var(--mint-50),var(--mint-100));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.cols-2{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;padding:8px 10px;flex-direction:row;border-radius:20px 20px 0 0;gap:0}
  .brand,.store-chip,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:.7rem;padding:7px 8px}
  .nav .count{position:absolute;margin:0;transform:translate(14px,-12px)}
  .nav a{position:relative}
  .main{padding-bottom:110px}
  .hero{flex-direction:column;align-items:flex-start}
  .stack3d{display:none}
}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>

<div id="app">
  <div class="main"><div class="skeleton" style="height:40px;width:260px"></div>
  <div class="skeleton" style="height:220px;margin-top:20px;border-radius:28px"></div></div>
</div>

<script>
/* =========================================================
   FUNAAB Marketplace · Vendor Dashboard
   ---------------------------------------------------------
   DATA: every number on this page is calculated from the
   records returned by loadData(). Nothing is hardcoded.

   To connect your backend, define this BEFORE this script:
     window.FUNAAB_API = { loadVendorData: async () => ({...}) }
   It must return:
     { vendor:{name,status,storeName,logoUrl,storeUrl},
       orders:[{id,ref,customer,status,paymentStatus,createdAt,
                items:[{name,qty,price}]}],
       products:[{id,name,price,stock,lowStockAt,status}],
       notifications:[{id,text,at,read}] }
   (price on each order item = price at time of purchase)

   Preview with sample records:  vendor-dashboard.html?demo=1

   SECURITY: the check below only decides what to SHOW.
   Your backend must still reject every vendor request from
   anyone who is not an approved vendor.
   ========================================================= */

const NGN = new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0});
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 864e5;
const ACTIVE = ['new','accepted','preparing','ready','out_for_delivery'];
const DEAD = ['cancelled','rejected'];
const STATUS_LABEL = {new:'New',accepted:'Accepted',preparing:'Preparing',ready:'Ready',out_for_delivery:'On the way',completed:'Completed',cancelled:'Cancelled',rejected:'Rejected'};

const ICON = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 11H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 5 4h14l1 5"/><path d="M4 9a3 3 0 0 0 5 2 3 3 0 0 0 6 0 3 3 0 0 0 5-2"/><path d="M5 12v8h14v-8"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6l2-8Z"/></svg>'
};

/* ---------- Data ---------- */
async function loadData(){
  if (new URLSearchParams(location.search).has('demo')) return demoData();
  if (window.FUNAAB_API?.loadVendorData) return window.FUNAAB_API.loadVendorData();
  return {vendor:null,orders:[],products:[],notifications:[]};
}

function demoData(){
  const now = Date.now(), h = 36e5;
  const it = (name,qty,price)=>({name,qty,price});
  const orders = [
    {id:'1',ref:'FM-10481',customer:'Adaeze O.',status:'new',paymentStatus:'paid',createdAt:now-1*h,items:[it('Jollof rice pack',2,1800),it('Chilled zobo',2,500)]},
    {id:'2',ref:'FM-10480',customer:'Tunde A.',status:'new',paymentStatus:'paid',createdAt:now-3*h,items:[it('Fried rice pack',1,2000)]},
    {id:'3',ref:'FM-10477',customer:'Blessing E.',status:'preparing',paymentStatus:'paid',createdAt:now-8*h,items:[it('Jollof rice pack',3,1800)]},
    {id:'4',ref:'FM-10472',customer:'Ibrahim K.',status:'ready',paymentStatus:'paid',createdAt:now-1*DAY,items:[it('Meat pie',6,700)]},
    {id:'5',ref:'FM-10466',customer:'Chioma N.',status:'completed',paymentStatus:'paid',createdAt:now-1.2*DAY,items:[it('Fried rice pack',2,2000),it('Chilled zobo',2,500)]},
    {id:'6',ref:'FM-10459',customer:'Seun B.',status:'completed',paymentStatus:'paid',createdAt:now-2.1*DAY,items:[it('Jollof rice pack',4,1800)]},
    {id:'7',ref:'FM-10452',customer:'Kemi L.',status:'cancelled',paymentStatus:'refunded',createdAt:now-2.4*DAY,items:[it('Meat pie',4,700)]},
    {id:'8',ref:'FM-10447',customer:'David M.',status:'completed',paymentStatus:'paid',createdAt:now-3.3*DAY,items:[it('Fried rice pack',3,2000)]},
    {id:'9',ref:'FM-10431',customer:'Funmi S.',status:'completed',paymentStatus:'paid',createdAt:now-4.5*DAY,items:[it('Jollof rice pack',5,1800)]},
    {id:'10',ref:'FM-10420',customer:'Ope R.',status:'completed',paymentStatus:'paid',createdAt:now-5.6*DAY,items:[it('Meat pie',10,700)]},
    {id:'11',ref:'FM-10415',customer:'Yusuf G.',status:'new',paymentStatus:'pending',createdAt:now-20*60e3,items:[it('Jollof rice pack',1,1800)]}
  ];
  return {
    vendor:{name:'Mama Tolu',status:'approved',storeName:"Mama Tolu's Kitchen",logoUrl:'',storeUrl:'#'},
    orders,
    products:[
      {id:'p1',name:'Jollof rice pack',price:1800,stock:24,lowStockAt:10,status:'published'},
      {id:'p2',name:'Fried rice pack',price:2000,stock:6,lowStockAt:10,status:'published'},
      {id:'p3',name:'Meat pie',price:700,stock:3,lowStockAt:12,status:'published'},
      {id:'p4',name:'Chilled zobo',price:500,stock:40,lowStockAt:10,status:'published'},
      {id:'p5',name:'Chin chin (500g)',price:1500,stock:0,lowStockAt:8,status:'out_of_stock'},
      {id:'p6',name:'Party tray',price:25000,stock:2,lowStockAt:1,status:'paused'}
    ],
    notifications:[
      {id:'n1',text:'New order FM-10481 from Adaeze O.',at:now-1*h,read:false},
      {id:'n2',text:'Meat pie is running low (3 left).',at:now-5*h,read:false},
      {id:'n3',text:'Your vendor application was approved.',at:now-6*DAY,read:true}
    ]
  };
}

/* ---------- Calculations (all from records) ---------- */
const orderTotal = o => o.items.reduce((s,i)=>s+i.qty*i.price,0);
const counts = o => o.items.reduce((s,i)=>s+i.qty,0);
const countsAsSale = o => o.paymentStatus==='paid' && !DEAD.includes(o.status);

function compute(d){
  const sales = d.orders.filter(countsAsSale);
  const start = new Date(); start.setHours(0,0,0,0);
  const days = [...Array(7)].map((_,i)=>{
    const t0 = start.getTime() - (6-i)*DAY;
    const value = sales.filter(o=>o.createdAt>=t0 && o.createdAt<t0+DAY).reduce((s,o)=>s+orderTotal(o),0);
    return {label:new Date(t0).toLocaleDateString('en-NG',{weekday:'short'}),value};
  });
  const live = d.products.filter(p=>p.status!=='archived');
  return {
    totalSales: sales.reduce((s,o)=>s+orderTotal(o),0),
    salesCount: sales.length,
    newOrders: d.orders.filter(o=>o.status==='new' && o.paymentStatus==='paid').length,
    pending: d.orders.filter(o=>ACTIVE.includes(o.status)).length,
    completed: d.orders.filter(o=>o.status==='completed').length,
    productCount: live.length,
    lowStock: live.filter(p=>p.status!=='paused' && p.stock>0 && p.stock<=p.lowStockAt),
    outOfStock: live.filter(p=>p.stock===0 && p.status!=='paused'),
    days,
    transactions: d.orders.filter(o=>['paid','refunded'].includes(o.paymentStatus)).sort((a,b)=>b.createdAt-a.createdAt),
    unread: d.notifications.filter(n=>!n.read).length
  };
}

/* ---------- Helpers ---------- */
function ago(t){
  const m = Math.max(1,Math.round((Date.now()-t)/6e4));
  if (m<60) return m+' min ago';
  const h = Math.round(m/60); if (h<24) return h+' hr ago';
  const d = Math.round(h/24); return d+(d===1?' day ago':' days ago');
}
function badge(status){
  const cls = status==='new'?'b-new':status==='completed'?'b-done':DEAD.includes(status)?'b-off':'b-progress';
  return `<span class="badge ${cls}">${STATUS_LABEL[status]||esc(status)}</span>`;
}
const empty = (icon,title,text)=>`<div class="empty">${ICON[icon]}<b>${title}</b>${text}</div>`;

/* ---------- Views ---------- */
function overview(d,c){
  const chartMax = Math.max(...c.days.map(x=>x.value),1);
  const chart = c.salesCount===0 && c.days.every(x=>!x.value)
    ? empty('chart','No sales yet','Paid orders will show up here as soon as customers start buying.')
    : `<div class="chart" role="img" aria-label="Sales for the last 7 days">${c.days.map(x=>`
        <div class="bar"><em>${x.value?NGN.format(x.value).replace('NGN','₦'):''}</em>
        <div class="col ${x.value?'':'zero'}" style="height:${Math.max(x.value/chartMax*100,3)}%"></div><span>${x.label}</span></div>`).join('')}</div>`;

  const stockRows = [...c.outOfStock.map(p=>({p,tag:'<span class="badge b-off">Out of stock</span>'})),
                     ...c.lowStock.map(p=>({p,tag:`<span class="badge b-low">${p.stock} left</span>`}))];
  const stock = stockRows.length
    ? `<div class="list">${stockRows.map(({p,tag})=>`<div class="row"><div class="grow"><b>${esc(p.name)}</b><small>Alert at ${p.lowStockAt} or fewer</small></div>${tag}</div>`).join('')}</div>`
    : empty('check','Stock looks healthy','Items running low will appear here.');

  const recent = d.orders.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  const recentHtml = recent.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>${recent.map(o=>`<tr><td><b>${esc(o.ref)}</b><br><small>${ago(o.createdAt)}</small></td><td>${esc(o.customer)}</td><td>${counts(o)}</td><td class="amount">${NGN.format(orderTotal(o))}</td><td>${badge(o.status)}</td></tr>`).join('')}</tbody></table></div>`
    : empty('inbox','No orders yet','When a customer buys from your store, the order appears here.');

  const tx = c.transactions.slice(0,5);
  const txHtml = tx.length ? `<div class="list">${tx.map(o=>`<div class="row"><div class="grow"><b>${esc(o.ref)}</b><small>${esc(o.customer)} · ${ago(o.createdAt)}</small></div>
      <span class="amount">${o.paymentStatus==='refunded'?'−':'+'}${NGN.format(orderTotal(o))}</span></div>`).join('')}</div>`
    : empty('inbox','No transactions yet','Payments and refunds will be listed here.');

  return `
  <section class="hero" aria-label="Total sales">
    <div><div class="kicker">Total sales</div>
      <div class="big">${NGN.format(c.totalSales)}</div>
      <div class="meta">${c.salesCount? `From ${c.salesCount} paid ${c.salesCount===1?'order':'orders'}, excluding cancelled and refunded.` : 'Your first paid order will start the count.'}</div></div>
    <div class="stack3d" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <div class="grid stats">
    <div class="card stat"><div class="label">${ICON.inbox}New orders</div><div class="num">${c.newOrders}</div><div class="hint">Paid and waiting for you</div></div>
    <div class="card stat"><div class="label">${ICON.clock}Pending orders</div><div class="num">${c.pending}</div><div class="hint">In progress right now</div></div>
    <div class="card stat"><div class="label">${ICON.check}Completed</div><div class="num">${c.completed}</div><div class="hint">Delivered or collected</div></div>
    <div class="card stat"><div class="label">${ICON.box}Products</div><div class="num">${c.productCount}</div><div class="hint">${c.lowStock.length+c.outOfStock.length} need restocking</div></div>
  </div>

  <div class="grid cols">
    <div class="card"><h2>Sales this week</h2><div class="sub">Paid orders, last 7 days</div>${chart}</div>
    <div class="card"><h2>Stock alerts</h2><div class="sub">Restock before customers miss out</div>${stock}</div>
  </div>

  <div class="grid cols-2" style="grid-template-columns:1.6fr 1fr">
    <div class="card"><h2>Recent orders</h2><div class="sub">Your latest five</div>${recentHtml}
      <p style="margin-top:12px"><a class="btn secondary" href="#/orders">See all orders</a></p></div>
    <div class="card"><h2>Recent transactions</h2><div class="sub">Money in and refunds out</div>${txHtml}</div>
  </div>`;
}

let orderFilter='all';
function ordersView(d){
  const filters=[['all','All'],['new','New'],['active','In progress'],['completed','Completed'],['closed','Cancelled']];
  const match=o=>orderFilter==='all'||(orderFilter==='active'?ACTIVE.includes(o.status)&&o.status!=='new':orderFilter==='closed'?DEAD.includes(o.status):o.status===orderFilter);
  const list=d.orders.filter(match).sort((a,b)=>b.createdAt-a.createdAt);
  return `<div class="card"><div class="chips">${filters.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${orderFilter===k}">${l}</button>`).join('')}</div>
  ${list.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>
  ${list.map(o=>`<tr><td><b>${esc(o.ref)}</b><br><small>${ago(o.createdAt)}</small></td><td>${esc(o.customer)}</td><td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(', ')}</td><td class="amount">${NGN.format(orderTotal(o))}</td><td>${esc(o.paymentStatus)}</td><td>${badge(o.status)}</td></tr>`).join('')}</tbody></table></div>`
  : empty('inbox','No orders here','Nothing matches this filter yet.')}
  <p class="sub" style="margin-top:14px">Accept, reject and status updates come with the order centre in the next step.</p></div>`;
}

function productsView(d){
  const list=d.products.filter(p=>p.status!=='archived');
  const lbl={published:['Published','b-done'],paused:['Paused','b-off'],out_of_stock:['Out of stock','b-off'],draft:['Draft','b-progress'],pending_review:['Pending review','b-progress'],rejected:['Rejected','b-off']};
  return `<div class="card">${list.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody>
  ${list.map(p=>{const l=lbl[p.status]||[p.status,'b-progress'];return `<tr><td><b>${esc(p.name)}</b></td><td>${NGN.format(p.price)}</td><td>${p.stock}${p.stock>0&&p.stock<=p.lowStockAt?' <span class="badge b-low">Low</span>':''}</td><td><span class="badge ${l[1]}">${l[0]}</span></td></tr>`}).join('')}</tbody></table></div>`
  : empty('box','No products yet','Add your first product to start selling.')}
  <p class="sub" style="margin-top:14px">Adding, editing, images and variations come with product management in the next step.</p></div>`;
}
const soon=(icon,t,x)=>`<div class="card">${empty(icon,t,x)}</div>`;

/* ---------- App ---------- */
const VIEWS={
  overview:{title:'Overview',sub:d=>`Here is how ${esc(d.vendor.storeName)} is doing.`,icon:'home',render:(d,c)=>overview(d,c)},
  orders:{title:'Orders',sub:()=>'Every order placed with your store.',icon:'orders',render:d=>ordersView(d)},
  products:{title:'Products',sub:()=>'What you sell and how much is left.',icon:'box',render:d=>productsView(d)},
  store:{title:'My store',sub:()=>'How customers see your storefront.',icon:'store',render:d=>{const demo=new URLSearchParams(location.search).has('demo')?'?demo=1':'';
    const sf=d.vendor.storeUrl&&d.vendor.storeUrl!=='#'?esc(d.vendor.storeUrl):'storefront.html'+(demo?'?demo=1':'');
    return `<div class="card"><h2>${esc(d.vendor.storeName)}</h2><div class="sub">Update your logo, cover image, description, opening hours and how customers get their orders.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="vendor-store.html${demo}">Edit my store</a><a class="btn secondary" href="${sf}">View public storefront</a></div></div>`}},
  reports:{title:'Reports',sub:()=>'Sales and stock over time.',icon:'chart',render:()=>soon('chart','Reports come after orders','Best sellers, cancellations and sales value will be built from your order history.')}
};

let DATA=null,popOpen=false;
const app=document.getElementById('app');

function route(){const k=(location.hash.replace('#/','')||'overview');return VIEWS[k]?k:'overview'}

function render(){
  const d=DATA;
  if(!d||!d.vendor||d.vendor.status!=='approved'){
    const st=d?.vendor?.status;
    app.innerHTML=`<div class="gate"><h1>${st?'Your application is '+esc(String(st).replace(/_/g,' ')):'Vendor dashboard'}</h1>
      <p>${st?'You will get access here as soon as it is approved.':'This area is for approved vendors. Apply to open a store on FUNAAB Marketplace.'}</p>
      <a class="btn" href="/">Back to the marketplace</a></div>`;return;
  }
  const c=compute(d),k=route(),v=VIEWS[k];
  const initials=d.vendor.storeName.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  app.innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="brand"><img class="brand-logo" src="1001047956-removebg-preview.png" alt="" width="34" height="34">FUNAAB Market</div>
      <div class="store-chip"><div class="avatar">${d.vendor.logoUrl?`<img src="${esc(d.vendor.logoUrl)}" alt="">`:esc(initials)}</div>
        <div><b>${esc(d.vendor.storeName)}</b><small>Approved vendor</small></div></div>
      <nav class="nav" aria-label="Vendor navigation">
        ${Object.entries(VIEWS).map(([key,x])=>`<a href="#/${key}" ${k===key?'aria-current="page"':''}>${ICON[x.icon]}${x.title}${key==='orders'&&c.newOrders?`<span class="count">${c.newOrders}</span>`:''}</a>`).join('')}
      </nav>
      <div class="side-foot"><a class="ghost-btn" href="${esc(d.vendor.storeUrl||'#')}">View my storefront</a><a class="ghost-btn" href="/">Switch to shopping</a></div>
    </aside>
    <main class="main">
      <header class="top">
        <div><h1>${v.title}</h1><p>${v.sub(d)}</p></div>
        <div class="top-actions">
          <button class="bell" id="bell" aria-label="Notifications" aria-expanded="${popOpen}">${ICON.bell}${c.unread?`<span class="dot">${c.unread}</span>`:''}</button>
          ${popOpen?`<div class="panel-pop" role="dialog" aria-label="Notifications"><h3>Notifications ${c.unread?'<button id="markread">Mark all read</button>':''}</h3>
            ${d.notifications.length?d.notifications.slice().sort((a,b)=>b.at-a.at).map(n=>`<div class="note ${n.read?'':'unread'}"><div>${esc(n.text)}<small>${ago(n.at)}</small></div></div>`).join(''):empty('bell','All quiet','New orders and stock alerts will appear here.')}</div>`:''}
        </div>
      </header>
      ${v.render(d,c)}
    </main>
  </div>`;
  document.title=v.title+' · Vendor Dashboard';
}

app.addEventListener('click',e=>{
  const bell=e.target.closest('#bell');
  if(bell){popOpen=!popOpen;render();return}
  if(e.target.id==='markread'){DATA.notifications.forEach(n=>n.read=true);window.FUNAAB_API?.markNotificationsRead?.();render();return}
  const chip=e.target.closest('[data-filter]');
  if(chip){orderFilter=chip.dataset.filter;render();return}
  if(popOpen&&!e.target.closest('.panel-pop')){popOpen=false;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popOpen){popOpen=false;render()}});
window.addEventListener('hashchange',()=>{popOpen=false;render();scrollTo(0,0)});

/* Re-load when your backend signals a change (new order, stock edit...).
   Dispatch it from your realtime listener:
   window.dispatchEvent(new Event('funaab:vendor-updated'))        */
window.addEventListener('funaab:vendor-updated',async()=>{DATA=await loadData();render()});

(async()=>{DATA=await loadData();render()})();
</script>
</body>
</html>
