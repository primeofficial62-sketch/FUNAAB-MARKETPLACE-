<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#064e3b">
<meta name="color-scheme" content="light dark">
<script>(function(){var t=null;try{t=localStorage.getItem('fm_admin_theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
<title>Admin · FUNAAB Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:#fff;--emerald:#0a5c3e;--deep:#064e3b;--forest:#03281b;--fresh:#34d399;--mist:#f1f8f4;--mint:#dcefe5;--line:rgba(6,78,59,.16);--ink:#03281b;--soft:#4a6b5c;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--shadow:0 8px 24px -14px rgba(3,40,27,.35),0 2px 5px rgba(3,40,27,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--mist);line-height:1.45;min-height:100vh}
body.lock{overflow:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.02em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--fresh);outline-offset:2px;border-radius:10px}

/* PIN gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--forest),var(--emerald))}
.gate-box{width:100%;max-width:340px;text-align:center;color:#fff}
.gate-box img{height:64px;width:auto;margin:0 auto 14px;display:block}
.gate-box h1{font-size:1.5rem;margin-bottom:4px}
.gate-box p{color:#b7e4d0;font-size:.92rem}
.dots{display:flex;justify-content:center;gap:16px;margin:26px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #6ee7b7;transition:background .15s,transform .15s}
.dots i.on{background:#6ee7b7;transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#gateMsg{min-height:22px;color:#fecaca;font-weight:600;font-size:.9rem;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:62px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:1.5rem;font-weight:700;transition:background .12s,transform .1s}
.pad button:active{background:rgba(255,255,255,.28);transform:scale(.94)}
.pad .ghost{background:none;border-color:transparent;font-size:1.2rem}

/* app shell */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{height:34px;width:auto}
.top .t{font-family:'Bricolage Grotesque';font-weight:800;color:var(--deep);font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--emerald);background:var(--mint);border-radius:99px;padding:5px 10px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--fresh);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--deep)}
.ib:hover{background:var(--mint)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drawer{position:fixed;inset:0;z-index:90}
.dr-bg{position:absolute;inset:0;background:rgba(3,40,27,.55)}
.dr-card{position:absolute;top:0;bottom:0;left:0;width:min(310px,86vw);background:var(--card);padding:max(16px,env(safe-area-inset-top)) 14px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;animation:slideIn .22s ease-out;box-shadow:12px 0 40px -10px rgba(3,40,27,.4)}
@keyframes slideIn{from{transform:translateX(-100%)}}
.dr-top{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dr-top img{height:38px;width:auto}
.dr-top b{font-family:'Bricolage Grotesque';font-size:1.05rem;color:var(--deep);flex:1}
.dr-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;font-weight:700;color:var(--soft);text-align:left;width:100%}
.dr-item span{font-size:1.15rem;width:24px;text-align:center}
.dr-item.on{background:var(--emerald);color:#fff}
.dr-item em{font-style:normal;margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 8px}
.dr-sep{height:1px;background:var(--line);margin:8px 0}
main{max-width:1100px;margin:0 auto;padding:16px 14px 90px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h2{font-size:1.35rem}
.sub{color:var(--soft);font-size:.9rem}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--emerald);color:#fff;font-weight:700;font-size:.9rem;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn.ghost{background:var(--mint);color:var(--deep)}
.btn.danger{background:var(--red)}
.btn.warn{background:var(--amber)}
.search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.84rem;color:var(--soft)}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat span{font-size:.8rem;color:var(--soft);font-weight:600}
.stat b{display:block;font-family:'Bricolage Grotesque';font-size:1.55rem;color:var(--deep)}
.stat small{color:var(--soft);font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:1rem}
.row{display:flex;gap:10px;align-items:flex-start}
.grow{flex:1;min-width:0}
.thumb{width:52px;height:52px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:1.5rem;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{font-size:.84rem;color:var(--soft);margin-top:2px;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--mint);color:var(--deep);text-transform:capitalize}
.pill.red{background:#fee2e2;color:#991b1b}.pill.amber{background:#fef3c7;color:#92400e}.pill.green{background:#d1fae5;color:#065f46}.pill.blue{background:#dbeafe;color:#1e40af}
.empty{text-align:center;color:var(--soft);padding:36px 10px}
.note{background:var(--mist);border-radius:12px;padding:9px 12px;font-size:.84rem;margin-top:8px}
.alert{display:flex;align-items:center;gap:10px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-weight:600;cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.65rem;color:var(--soft)}
.bars i{display:block;width:100%;background:var(--emerald);border-radius:6px 6px 2px 2px;min-height:3px}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.line:last-child{border:0}
.stars{color:#f59e0b;letter-spacing:1px}

/* forms + sheet */
.field{margin-bottom:12px}
.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px;color:var(--deep)}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sh-bg{position:absolute;inset:0;background:rgba(3,40,27,.55)}
.sh-card{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:600px){.sheet{align-items:center}.sh-card{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-card h3{font-size:1.2rem;margin-bottom:6px}
.sh-card p{color:var(--soft);margin-bottom:12px;font-size:.92rem}
.sh-card .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw input{appearance:none;width:50px;height:30px;border-radius:99px;background:#cbd5d1;position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--emerald)}
.sw input:checked::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--forest);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.setup{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:20px auto;max-width:560px}

/* dark mode */
:root[data-theme="dark"]{color-scheme:dark;--card:#12261d;--mist:#0a1812;--mint:#173a2c;--line:rgba(110,231,183,.2);--ink:#e6f4ec;--soft:#9dbbab;--deep:#6ee7b7;--shadow:0 8px 24px -14px rgba(0,0,0,.7),0 2px 5px rgba(0,0,0,.3)}
[data-theme="dark"] .chip.on{background:var(--emerald);border-color:var(--emerald)}
[data-theme="dark"] .live{color:var(--fresh)}
[data-theme="dark"] .bars i{background:var(--fresh)}
[data-theme="dark"] .pill.red{background:#4c1d1d;color:#fecaca}
[data-theme="dark"] .pill.amber{background:#4a3410;color:#fde68a}
[data-theme="dark"] .pill.green{background:#0f3d2c;color:#a7f3d0}
[data-theme="dark"] .pill.blue{background:#1e3a5f;color:#bfdbfe}
[data-theme="dark"] .alert{background:#3b2e0c;border-color:#7c5e10;color:#fde68a}
[data-theme="dark"] .note[style*="fef3c7"]{background:#3b2e0c!important;color:#fde68a}
[data-theme="dark"] .field input,[data-theme="dark"] .field select,[data-theme="dark"] .field textarea,[data-theme="dark"] .search{color:var(--ink)}
[data-theme="dark"] .dr-item.on{background:var(--emerald);color:#fff}
[data-theme="dark"] .sw input{background:#3a4f45}
[data-theme="dark"] .sw input:checked{background:var(--emerald)}
[data-theme="dark"] .btn.ghost{background:var(--mint);color:var(--deep)}
</style>
</head>
<body>

<!-- ============ PIN GATE ============ -->
<div id="gate">
  <div class="gate-box">
    <img id="gLogo" src="1001047956-removebg-preview.png" alt="FUNAAB Marketplace" onerror="this.style.display='none'">
    <h1>Admin access</h1>
    <p>Enter your 4-digit PIN</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div id="gateMsg" role="alert"></div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" disabled></button><button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Delete">⌫</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <header class="top">
    <button class="ib" data-act="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <img src="1001047956-removebg-preview.png" alt="" onerror="this.style.display='none'">
    <div class="t" id="ttl">Dashboard</div>
    <div class="live"><b></b>Live</div>
  </header>
  <aside class="drawer" id="drawer" hidden>
    <div class="dr-bg" data-act="menu"></div>
    <nav class="dr-card" id="tabs" aria-label="Admin menu"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG (same Supabase project as the marketplace)
   ============================================================ */
const CFG = {
  SB_URL: 'https://ikyqahzhtckpelzkmgyh.supabase.co',
  SB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlreXFhaHpodGNrcGVsemttZ3loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjI1MzUsImV4cCI6MjEwNDUzODUzNX0.keL7ynC_-ViGceD1tMvBsDMd9ejg5IzIPydyWiNZZvk',
  POLL_MS: 20000,            // live refresh
  IDLE_MS: 15 * 60 * 1000    // auto-lock after 15 idle minutes
};
const CATS = [['food','Food & Snacks','🍲'],['fashion','Fashion','👕'],['tech','Electronics','🎧'],['books','Books','📚'],['beauty','Beauty','🧴'],['grocery','Groceries','🛒'],['home','Home Essentials','🧺'],['print','Printing & Design','🖨️'],['laundry','Laundry & Cleaning','🫧'],['other','Other','✨']];
const catOf = id => CATS.find(c => c[0] === id) || CATS[9];
const sb = window.supabase ? window.supabase.createClient(CFG.SB_URL, CFG.SB_KEY, {
  auth:{ persistSession:false, autoRefreshToken:false },
  global:{ fetch:(url, opts) => {
    opts = Object.assign({}, opts || {});
    if (opts.headers && typeof opts.headers.forEach === 'function' && !Array.isArray(opts.headers)){
      const h = {}; opts.headers.forEach((v, k) => { h[k] = v; }); opts.headers = h;
    }
    return fetch(typeof url === 'string' ? url : String(url.url || url), opts);
  } }
}) : null;

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const fdate = t => t ? new Date(t).toLocaleString('en-NG', { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' }) : '—';
const ago = t => { if (!t) return 'never'; const m = Math.floor((Date.now() - new Date(t)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.floor(m / 60); if (h < 24) return h + ' h ago'; return Math.floor(h / 24) + ' d ago'; };
const stars = n => { const r = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '★'.repeat(r) + '☆'.repeat(5 - r); };
const tone = s => ({ approved:'green', active:'green', completed:'green', visible:'green', paid:'green', pending:'amber', accepted:'blue', preparing:'blue', ready:'blue', rejected:'red', suspended:'red', cancelled:'red', paused:'amber', hidden:'red', reported:'amber' }[String(s).toLowerCase()] || '');
const pill = s => `<span class="pill ${tone(s)}">${esc(s || '—')}</span>`;
let toastT;
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 3000); }
const errMsg = e => (e && (e.message || e.error_description)) || 'Something went wrong.';

/* ============================================================
   API: every call carries the PIN and is checked on the server
   ============================================================ */
let PIN = '';
async function api(action, args){
  if (!sb) throw new Error('Could not load the database library. Check your connection.');
  const r = await sb.rpc('admin_call', { p_pin:PIN, p_action:action, p_args:args || {} });
  if (r.error){
    if (r.error.code === 'PGRST202' || /admin_call/.test(r.error.message || '') && /not find|does not exist/i.test(r.error.message || ''))
      throw new Error('Admin setup not done yet. Run admin-setup.sql in the Supabase SQL editor.');
    throw r.error;
  }
  const d = r.data;
  if (d && !Array.isArray(d) && d.error){
    if (d.error === 'denied' || d.error === 'locked'){ lock(); }
    const e = new Error(d.error === 'locked' ? 'Locked. Try again in ' + Math.ceil(d.retry_in / 60) + ' min.' : 'Incorrect PIN.'); e.auth = d; throw e;
  }
  return d;
}

/* ============================================================
   PIN GATE
   ============================================================ */
let entry = '', checking = false;
function drawDots(){ $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < entry.length)); }
function press(k){
  if (checking) return;
  if (k === 'del') entry = entry.slice(0, -1);
  else if (/^\d$/.test(k) && entry.length < 4) entry += k;
  drawDots(); $('#gateMsg').textContent = '';
  if (entry.length === 4) tryPin();
}
async function tryPin(){
  checking = true; PIN = entry;
  try{
    await api('verify');
    sessionStorage.setItem('fm_admin_pin', PIN);
    entry = ''; drawDots(); enter();
  }catch(e){
    PIN = ''; entry = ''; drawDots();
    const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    $('#gateMsg').textContent = e.auth ? (e.auth.error === 'locked' ? 'Too many attempts. Try again in ' + Math.ceil(e.auth.retry_in / 60) + ' min.' : 'Incorrect PIN') : errMsg(e);
  }
  checking = false;
}
$('#pad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
addEventListener('keydown', e => {
  if ($('#gate').hidden) return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del');
});

function lock(){
  PIN = ''; sessionStorage.removeItem('fm_admin_pin');
  clearInterval(pollT); clearTimeout(idleT);
  closeSheet(true); $('#drawer').hidden = true;
  $('#app').hidden = true; $('#gate').hidden = false;
  entry = ''; drawDots();
}

/* ============================================================
   STATE + LOADERS
   ============================================================ */
const TABS = [['dash','Dashboard'],['stores','Stores'],['products','Products'],['orders','Orders'],['reviews','Reviews'],['users','Users'],['notify','Broadcast'],['settings','Site settings']];
const ST = { tab:'dash', q:'', f:'all', stats:null, stores:null, products:null, orders:null, reviews:null, reports:null, users:null, settings:null, busy:false };
let pollT, idleT;

function enter(){
  $('#gate').hidden = true; $('#app').hidden = false;
  ST.tab = (location.hash || '#dash').slice(1); if (!TABS.some(t => t[0] === ST.tab)) ST.tab = 'dash';
  drawTabs(); loadTab(true);
  clearInterval(pollT); pollT = setInterval(poll, CFG.POLL_MS);
  bumpIdle();
}
function bumpIdle(){ clearTimeout(idleT); idleT = setTimeout(() => { lock(); $('#gateMsg').textContent = 'Locked after inactivity'; }, CFG.IDLE_MS); }
['click','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, () => { if (PIN) bumpIdle(); }, { passive:true }));

async function loadTab(showErr){
  const t = ST.tab;
  try{
    const jobs = [api('stats').then(d => ST.stats = d)];
    if (t === 'stores')   jobs.push(api('list_stores').then(d => ST.stores = d));
    if (t === 'products') jobs.push(api('list_products').then(d => ST.products = d));
    if (t === 'orders' || t === 'dash') jobs.push(api('list_orders').then(d => ST.orders = d));
    if (t === 'reviews')  jobs.push(api('list_reviews').then(d => ST.reviews = d), api('list_reports').then(d => ST.reports = d).catch(() => ST.reports = []));
    if (t === 'users' || t === 'notify') jobs.push(api('list_users').then(d => ST.users = d));
    if (t === 'settings') jobs.push(api('get_settings').then(d => ST.settings = d), api('email_get').then(d => ST.email = d).catch(() => ST.email = { missing:true }));
    await Promise.all(jobs);
    ST.err = '';
  }catch(e){ if (PIN){ ST.err = errMsg(e); if (showErr) toast(ST.err); } }
  if (PIN){ drawTabs(); render(); }
}
function poll(){
  if (document.hidden || !PIN || !$('#sheet').hidden || !$('#drawer').hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  loadTab(false);
}
const act = async (fn, okMsg) => { try{ await fn(); if (okMsg) toast(okMsg); }catch(e){ toast(errMsg(e), 8000); } await loadTab(false); };

  const s = ST.stats || {};

const toggleMenu = on => { const d = $('#drawer'); d.hidden = on === undefined ? !d.hidden : !on; document.body.classList.toggle('lock', !d.hidden || !$('#sheet').hidden); };
function setTab(k){ toggleMenu(false); ST.tab = k; ST.q = ''; ST.f = 'all'; location.hash = k; drawTabs(); render(); window.scrollTo(0, 0); loadTab(true); }
function render(){
  const m = $('#main');
  const keepQ = $('#q') && document.activeElement === $('#q');
  const fn = { dash:vDash, stores:vStores, products:vProducts, orders:vOrders, reviews:vReviews, users:vUsers, notify:vNotify, settings:vSettings }[ST.tab];
  const html = (ST.err && !ST.stats) ? `<div class="setup"><h3>Could not load</h3><p class="sub" style="margin:8px 0 14px">${esc(ST.err)}</p><button class="btn" data-act="refresh">Try again</button></div>` : fn();

}

function distinct(list, key){ return [...new Set((list || []).map(x => x[key]).filter(Boolean))]; }

let onClose = null;

  return new Promise(res => {

  sheet(`<h3>Edit product</h3>
  <div class="field"><label>Name</label><input id="eName" value="${esc(p.name)}"></div>
  <div class="two"><div class="field"><label>Price (₦)</label><input id="ePrice" type="number" min="0" inputmode="numeric" value="${esc(p.price)}"></div><div class="field"><label>Stock</label><input id="eStock" type="number" min="0" inputmode="numeric" value="${esc(p.stock)}"></div></div>
  <div class="two"><div class="field"><label>Category</label><select id="eCat">${CATS.map(c => `<option value="${c[0]}" ${c[0] === p.category ? 'selected' : ''}>${c[2]} ${esc(c[1])}</option>`).join('')}</select></div>
  <div class="field"><label>Status</label><select id="eStat">${[...new Set(['active', 'paused', p.status])].map(x => `<option ${x === p.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div></div>
  <div class="field"><label>Description</label><textarea id="eDesc">${esc(p.description)}</textarea></div>
  <div class="btns"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="prod-save" data-id="${p.id}">Save changes</button></div>`);
}
function orderForm(o){
  const pays = [...new Set([...distinct(ST.orders, 'payment_status'), 'paid'])];
  sheet(`<h3>Edit order ${esc(o.ref)}</h3><p>Cancelling returns the items to stock.</p>
  <div class="two"><div class="field"><label>Order status</label><select id="eStat">${['pending', 'accepted', 'preparing', 'ready', 'completed', 'cancelled'].map(x => `<option ${x === o.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
  <div class="field"><label>Payment</label><select id="ePay">${pays.map(x => `<option ${x === o.payment_status ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div></div>
  <div class="btns"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="ord-save" data-id="${o.id}" data-old="${esc(o.status)}">Save</button></div>`);
}
function msgForm(u){
  sheet(`<h3>Message ${esc(u.name || u.email)}</h3><p>Appears in their notification bell.</p>
  <div class="field"><label>Title</label><input id="mTitle" maxlength="80"></div>
  <div class="field"><label>Message</label><textarea id="mBody" maxlength="300"></textarea></div>
  <div class="btns"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="user-send" data-id="${u.id}">Send</button></div>`);
}

/* ============================================================
   CSV EXPORT
   ============================================================ */
function csv(name, rows){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\n')], { type:'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
   ACTIONS: every button below changes the real database
   ============================================================ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]'); if (t){ setTab(t.dataset.tab); return; }
  const f = e.target.closest('[data-f]'); if (f){ ST.f = f.dataset.f; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, to = b.dataset.to;

  if (a === 'theme'){ const d = document.documentElement, n = d.dataset.theme === 'dark' ? 'light' : 'dark'; d.dataset.theme = n; try{ localStorage.setItem('fm_admin_theme', n); }catch(e){} drawTabs(); return; }
  if (a === 'menu'){ toggleMenu(); return; }
  if (a === 'close'){ closeSheet(); return; }
  if (a === 'refresh'){ toggleMenu(false); toast('Refreshing…'); loadTab(true); return; }
  if (a === 'lock'){ toggleMenu(false); lock(); return; }

  /* stores */
  if (a === 'store-approve') return act(() => api('update_store', { id, status:'approved', note:'' }), 'Store approved');
  if (a === 'store-reject'){ const n = await ask({ title:'Reject application', text:'The vendor will see this reason.', input:true, placeholder:'Why is it not approved?', ok:'Reject' }); if (n) act(() => api('update_store', { id, status:'rejected', note:n }), 'Application rejected'); return; }
  if (a === 'store-suspend'){ const n = await ask({ title:'Suspend store', text:'Its products disappear from the marketplace. The vendor will see this reason.', input:true, placeholder:'Why is it suspended?', ok:'Suspend' }); if (n) act(() => api('update_store', { id, status:'suspended', note:n }), 'Store suspended'); return; }
  if (a === 'store-edit'){ const s = byId(ST.stores, id); if (s) storeForm(s); return; }
  if (a === 'store-save'){ closeSheet(true); return act(() => api('update_store', { id, name:val('eName').trim(), category:val('eCat'), status:val('eStat'), phone:val('ePhone').trim(), hours:val('eHours').trim(), description:val('eDesc').trim(), note:val('eNote').trim() }), 'Store updated'); }
  if (a === 'store-del'){ const s = byId(ST.stores, id); if (await ask({ title:'Delete "' + (s ? s.name : 'store') + '"?', text:'This permanently removes the store and all its products. This cannot be undone.', ok:'Delete forever', danger:true })) act(() => api('delete_store', { id }), 'Store deleted'); return; }

  /* products */
  if (a === 'prod-edit'){ const p = byId(ST.products, id); if (p) prodForm(p); return; }
  if (a === 'prod-save'){ const price = Number(val('ePrice')), stock = parseInt(val('eStock'), 10); if (!(price >= 0) || !(stock >= 0)){ toast('Price and stock must be valid numbers.'); return; }
    closeSheet(true); return act(() => api('update_product', { id, name:val('eName').trim(), price, stock, category:val('eCat'), status:val('eStat'), description:val('eDesc').trim() }), 'Product updated'); }
  if (a === 'prod-toggle'){ const p = byId(ST.products, id); return act(() => api('update_product', { id, status:p.status === 'active' ? 'paused' : 'active' }), p.status === 'active' ? 'Product paused' : 'Product live'); }
  if (a === 'prod-del'){ const p = byId(ST.products, id); if (await ask({ title:'Delete "' + (p ? p.name : 'product') + '"?', text:'It is removed from the marketplace for good.', ok:'Delete', danger:true })) act(() => api('delete_product', { id }), 'Product deleted'); return; }

  /* orders */
  if (a === 'ord-next') return act(() => api('set_order', { id, status:to }), 'Order updated');
  if (a === 'ord-edit'){ const o = byId(ST.orders, id); if (o) orderForm(o); return; }
  if (a === 'ord-save'){ const st = val('eStat'); closeSheet(true); return act(() => api('set_order', { id, status:st === b.dataset.old ? null : st, payment_status:val('ePay') }), 'Order updated'); }
  if (a === 'ord-cancel'){ if (await ask({ title:'Cancel this order?', text:'The customer is notified and the items go back into stock.', ok:'Cancel order', danger:true })) act(() => api('set_order', { id, status:'cancelled' }), 'Order cancelled'); return; }
  if (a === 'ord-del'){ if (await ask({ title:'Delete this order?', text:'The record is removed permanently.', ok:'Delete', danger:true })) act(() => api('delete_order', { id }), 'Order deleted'); return; }
  if (a === 'orders-csv'){ const L = ST.orders || []; csv('orders.csv', [['Ref', 'Date', 'Store', 'Customer', 'Phone', 'Fulfilment', 'Total', 'Status', 'Payment']].concat(L.map(o => [o.ref, o.created_at, o.store_name, o.customer_name, o.phone, o.fulfil, o.total, o.status, o.payment_status]))); return; }

  /* reviews */
  if (a === 'rev-toggle') return act(() => api('set_review', { id, status:to }), to === 'hidden' ? 'Review hidden' : 'Review visible');
  if (a === 'rev-del'){ if (await ask({ title:'Delete this review?', text:'It is removed permanently and the rating updates.', ok:'Delete', danger:true })) act(() => api('delete_review', { id }), 'Review deleted'); return; }

  /* users */
  if (a === 'user-msg'){ const u = byId(ST.users, id); if (u) msgForm(u); return; }
  if (a === 'user-send'){ const title = val('mTitle').trim(), body = val('mBody').trim(); if (!title){ toast('Add a title.'); return; } closeSheet(true); return act(() => api('notify', { user_id:id, title, body }), 'Message sent'); }
  if (a === 'user-ban'){ const u = byId(ST.users, id), ban = to === '1'; if (await ask({ title:(ban ? 'Ban ' : 'Unban ') + (u.name || u.email) + '?', text:ban ? 'They will not be able to sign in again.' : 'They will be able to sign in again.', ok:ban ? 'Ban' : 'Unban', danger:ban })) act(() => api('ban_user', { id, ban }), ban ? 'User banned' : 'User unbanned'); return; }
  if (a === 'user-del'){ const u = byId(ST.users, id); if (await ask({ title:'Delete ' + (u.name || u.email) + '?', text:'The account is erased permanently. This cannot be undone.', ok:'Delete account', danger:true })) act(() => api('delete_user', { id }), 'Account deleted'); return; }
  if (a === 'users-csv'){ const L = ST.users || []; csv('users.csv', [['Name', 'Email', 'Phone', 'Joined', 'Last sign in', 'Orders', 'Store']].concat(L.map(u => [u.name, u.email, u.phone, u.created_at, u.last_sign_in_at, u.orders, u.store]))); return; }

  /* broadcast */
  if (a === 'notify-send'){
    const title = val('nTitle').trim(), body = val('nBody').trim(), user_id = val('nAud'), link = val('nLink');
    if (!title){ toast('Add a title.'); return; }
    if (!user_id && !(await ask({ title:'Send to everyone?', text:'Every registered user gets this notification.', ok:'Send' }))) return;
    b.disabled = true;
    try{ const r = await api('notify', { user_id, title, body, link }); toast('Sent to ' + r.sent + (r.sent === 1 ? ' user' : ' users')); $('#nTitle').value = ''; $('#nBody').value = ''; }
    catch(err){ toast(errMsg(err)); }
    b.disabled = false; return;
  }

  /* settings */
  if (a === 'set-announce'){ const v = { on:$('#anOn').checked, text:val('anText').trim(), tone:val('anTone'), id:Date.now() }; if (v.on && !v.text){ toast('Type the banner message first.'); return; } return act(() => api('set_setting', { key:'announcement', value:v }), v.on ? 'Banner is live' : 'Banner is off'); }
  if (a === 'set-maint'){ const v = { on:$('#mtOn').checked, message:val('mtText').trim() || 'We will be right back.' }; if (v.on && !(await ask({ title:'Turn on maintenance mode?', text:'Visitors will see your message and new orders will be blocked until you turn it off.', ok:'Turn on', danger:true }))) { $('#mtOn').checked = false; return; } return act(() => api('set_setting', { key:'maintenance', value:v }), v.on ? 'Maintenance mode ON' : 'Site is open'); }
  if (a === 'email-save') return act(() => api('email_set', { admin_email:val('emAdmin'), site_url:val('emUrl'), secret:val('emSecret') }), 'Email settings saved');
  if (a === 'email-test' || a === 'email-report'){
    b.disabled = true;
    try{
      await api(a === 'email-test' ? 'email_test' : 'send_report'); toast('Sending…');
      await new Promise(r => setTimeout(r, 4000));
      const log = await api('email_log'), l = log[0];
      toast(!l ? 'Queued. Check your inbox in a minute.' : (l.status >= 200 && l.status < 300) ? 'Sent ✅ Check your inbox' : 'Failed (' + (l.status || l.error) + '): ' + String(l.body || '').slice(0, 120));
    }catch(err){ toast(errMsg(err)); }
    b.disabled = false; return;
  }
  if (a === 'set-vendor'){ const v = { open:$('#vaOn').checked }; return act(() => api('set_setting', { key:'vendor_applications', value:v }), v.open ? 'Applications open' : 'Applications closed'); }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ ST.q = e.target.value; render(); } });

/* ============================================================
   START: resume if this tab was already unlocked
   ============================================================ */
(async function boot(){
  const saved = sessionStorage.getItem('fm_admin_pin');
  if (!saved) return;
  PIN = saved;
  try{ await api('verify'); enter(); }catch(e){ PIN = ''; sessionStorage.removeItem('fm_admin_pin'); }
})();
</script>
