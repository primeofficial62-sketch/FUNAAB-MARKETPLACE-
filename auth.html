<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up or sign in — FUNAAB Marketplace</title>
<meta name="description" content="Create your FUNAAB Marketplace account or sign in.">
<meta name="theme-color" content="#022c21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#04382a;
  --emerald:#07553e;
  --fresh:#2fbf71;
  --fresh-soft:#d9f7e6;
  --mint:#f4f7f5;
  --ink:#08261d;
  --muted:#4a6a5d;
  --line:#d9e5de;
  --ease:cubic-bezier(.22,.8,.24,1);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:#02281d;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{display:block}
.icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--fresh);outline-offset:3px;border-radius:8px}
h1,h2{font-family:var(--display);line-height:1.08;margin:0;letter-spacing:-.02em}

/* ---------- Full-page split layout ---------- */
.split{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}

/* left: brand panel */
.aside{color:#fff;display:flex;flex-direction:column;padding:32px 56px 48px;background:
  radial-gradient(700px 480px at 90% 10%,rgba(47,191,113,.24),transparent 65%),
  radial-gradient(600px 460px at 0% 100%,rgba(10,107,75,.75),transparent 70%),
  linear-gradient(160deg,var(--deep) 0%,#02281d 100%)}
.aside-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.logo-img{width:36px;height:36px;object-fit:contain;display:block;flex:none}
.back{padding:8px 16px;border-radius:999px;font-weight:500;font-size:.92rem;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);transition:background .25s}
.back:hover{background:rgba(255,255,255,.18)}
.aside-mid{margin-block:auto;padding:48px 0}
.aside-mid h2{font-size:clamp(2.3rem,3.8vw,3.5rem);font-weight:800;max-width:13ch}
.aside-mid p{font-weight:600;font-size:1.1rem;max-width:40ch;margin:18px 0 30px;color:rgba(255,255,255,.84)}
.points{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.points li{display:flex;gap:12px;align-items:flex-start;font-weight:600;color:rgba(255,255,255,.9)}
.points .icon{width:22px;height:22px;flex:none;color:var(--fresh);stroke-width:2;margin-top:2px}

/* right: form panel */
.panel{background:#fff;color:var(--ink);display:flex;flex-direction:column;padding:40px 32px 24px}
.panel-in{width:min(420px,100%);margin:auto;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0)}to{opacity:1;transform:none}}
.panel h1{font-size:clamp(1.5rem,5vw,1.95rem);font-weight:800;color:var(--deep)}
.sub{margin:6px 0 0;color:var(--muted);font-size:.92rem;line-height:1.5;font-weight:600}

.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:16px 0 16px}
.tabs button{font:inherit;font-size:.93rem;font-weight:700;padding:9px 0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);cursor:pointer;transition:color .25s,border-color .25s}
.tabs button[aria-pressed="true"]{color:var(--deep);border-bottom-color:var(--deep)}

.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:.9rem;color:var(--deep);cursor:pointer;transition:background .25s,transform .3s var(--ease)}
.btn-google:hover{background:var(--mint);transform:translateY(-2px)}
.btn-google svg{width:18px;height:18px;flex:none}
.or{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted);font-size:.8rem;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:.84rem;color:var(--deep)}
.input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:.95rem;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:#8aa397;font-weight:500}
.input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 4px var(--fresh-soft)}
.pw{position:relative}
.pw .input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,background .2s}
.eye:hover{color:var(--deep);background:var(--mint)}
.eye .icon{width:19px;height:19px}
.hint{color:var(--muted);font-size:.78rem;font-weight:600}

.row{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.link{background:none;border:0;padding:4px 0;font:inherit;font-weight:600;font-size:.85rem;color:var(--emerald);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:disabled{opacity:.6;cursor:not-allowed;text-decoration:none}
.link.center{display:block;margin:16px auto 0}

.check{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;font-weight:600;color:var(--muted);margin:2px 0 14px;line-height:1.5}
.check input{width:18px;height:18px;flex:none;margin:2px 0 0;accent-color:var(--emerald)}
.check a{color:var(--emerald);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.note{padding:10px 12px;border-radius:12px;font-weight:600;font-size:.84rem;margin-bottom:14px}
.note.error{background:#fdecea;color:#8a1c14;border:1px solid #f5c2bd}
.note.ok{background:var(--fresh-soft);color:var(--deep);border:1px solid #b6e8cc}

.submit{width:100%;padding:12px 24px;border:0;border-radius:999px;background:var(--deep);color:#fff;font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;box-shadow:0 14px 30px -14px rgba(4,56,42,.7);transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .2s}
.submit:hover{transform:translateY(-3px);box-shadow:0 20px 36px -14px rgba(4,56,42,.8)}
.submit:active{transform:translateY(0) scale(.98)}
.submit:disabled,.btn-google:disabled{opacity:.6;cursor:wait;transform:none}

.other{margin:18px 0 0;text-align:center;color:var(--muted);font-size:.86rem;font-weight:600}
.credit{margin:22px 0 0;text-align:center;font-size:.8rem;font-weight:600;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  /* No more html{font-size:93.75%}: it shrank every rem value on the page. */
  .split{display:flex;flex-direction:column}
  .aside{padding:14px 20px 48px}
  .aside-mid{display:none}
  .logo{gap:10px;font-size:clamp(1.05rem,4.6vw,1.2rem)}
  .logo-img{width:40px;height:40px}

  .panel{flex:1;position:relative;margin-top:-28px;border-radius:28px 28px 0 0;padding:28px clamp(18px,5.5vw,32px) 20px}
  /* top-aligned so the title doesn't jump when switching Sign up / Sign in */
  .panel-in{width:min(440px,100%);margin:0 auto auto}
  .panel h1{font-size:clamp(1.65rem,7.4vw,2rem)}
  .sub{font-size:1rem;margin-top:8px}

  .tabs{margin:18px 0}
  .tabs button{font-size:1rem;padding:12px 0}

  .btn-google{min-height:50px;padding:0 18px;gap:12px;font-size:1rem}
  .btn-google svg{width:20px;height:20px}
  .or{font-size:.875rem;margin:16px 0}

  .field{gap:7px;margin-bottom:14px}
  .field label{font-size:.9375rem}
  .input{height:50px;padding:0 16px;border-radius:14px;font-size:1rem}   /* 16px = no iOS zoom-on-focus */
  .pw .input{padding-right:54px}
  .eye{width:44px;height:44px;right:3px}
  .eye .icon{width:22px;height:22px}
  .hint{font-size:.875rem}

  .row{margin:-6px 0 12px}
  .link{font-size:.9375rem;padding:8px 0}
  .check{gap:12px;font-size:.9rem;margin:4px 0 16px}
  .check input{width:20px;height:20px;margin:2px 0 0}
  .note{font-size:.9rem;padding:12px 14px}

  .submit{min-height:52px;padding:0 24px;font-size:1.0625rem}
  .other{font-size:.9rem;margin-top:18px}
  .credit{font-size:.875rem;margin-top:20px}
}
@media (prefers-reduced-motion:reduce){.panel-in{animation:none}.submit,.btn-google{transition:none}}
</style>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
</svg>

<div class="split">

  <aside class="aside">
    <div class="aside-top">
      <a class="logo" href="index.html" aria-label="FUNAAB Marketplace home">
        <img class="logo-img" src="1001047956-removebg-preview.png" alt="" width="36" height="36">
        FUNAAB Marketplace
      </a>
    </div>
    <div class="aside-mid">
      <h2 id="asideTitle"></h2>
      <p id="asideLead"></p>
      <ul class="points" id="points"></ul>
    </div>
  </aside>

  <main class="panel">
    <div class="panel-in">

      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>

      <div class="tabs" id="tabs" role="group" aria-label="Sign in or sign up">
        <button type="button" data-mode="signup" aria-pressed="true">Sign up</button>
        <button type="button" data-mode="signin" aria-pressed="false">Sign in</button>
      </div>

      <div data-modes="signin signup">
        <button type="button" class="btn-google" id="googleBtn">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div class="or">or use your email</div>
      </div>

      <form id="form" novalidate>

        <div class="field" data-modes="signup">
          <label for="fullName">Full name</label>
          <input class="input" id="fullName" name="fullName" type="text" autocomplete="name" placeholder="Your full name" required>
        </div>

        <div class="field" data-modes="signin signup reset">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field" data-modes="signin signup update">
          <label for="password" id="pwLabel">Password</label>
          <div class="pw">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="eyeUse" href="#i-eye"/></svg></button>
          </div>
          <span class="hint" data-modes="signup update">Use at least 8 characters.</span>
        </div>

        <div class="row" data-modes="signin">
          <button type="button" class="link" id="forgot">Forgot password?</button>
        </div>

        <label class="check" data-modes="signup">
          <input type="checkbox" id="terms" required>
          <span>I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <div class="note" id="note" role="status" aria-live="polite" hidden></div>

        <button class="submit" id="submit" type="submit"><span id="submitLabel">Create account</span></button>

        <button type="button" class="link center" id="resend" hidden>Resend confirmation email</button>
        <button type="button" class="link center" id="backToSignin" data-modes="reset">Back to sign in</button>
      </form>

      <p class="other" data-modes="signin signup">Want to sell on campus? Create an account, then apply to become a vendor from inside the site.</p>

    </div>
    <p class="credit">Developed by PRIME</p>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  /* ============ CONFIG ============ */
  var SUPABASE_URL='https://ikyqahzhtckpelzkmgyh.supabase.co';
  var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlreXFhaHpodGNrcGVsemttZ3loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjI1MzUsImV4cCI6MjEwNDUzODUzNX0.keL7ynC_-ViGceD1tMvBsDMd9ejg5IzIPydyWiNZZvk';
  // Full URL of THIS page on your live site, e.g. 'https://funaabmarketplace.com/auth.html'
  // Leave '' to auto-detect (works on http(s) hosts and localhost, NOT when opened as a file).
  var AUTH_PAGE_URL='';
  // Everyone lands here after signing in. Vendors apply from inside the site.
  var HOME='funaab-marketplace.html';
  /* ================================== */

  var params=new URLSearchParams(location.search);
  var configured=SUPABASE_URL.indexOf('YOUR_')!==0 && SUPABASE_ANON_KEY.indexOf('YOUR_')!==0;
  var sb=(configured&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

  var $=function(id){return document.getElementById(id)};
  var form=$('form'),note=$('note'),pw=$('password'),submitBtn=$('submit'),googleBtn=$('googleBtn'),resendBtn=$('resend');
  var mode=params.get('mode');
  mode=(mode==='signin'||mode==='update')?mode:'signup';
  var pendingEmail='';

  var COPY={
    signin:['Welcome back','Sign in to keep shopping from your campus.','Sign in'],
    signup:['Create your account','Shop from trusted vendors in your university community.','Create account'],
    reset:['Reset your password','Enter your email and we will send you a reset link.','Send reset link'],
    update:['Set a new password','Choose a new password for your account.','Update password']
  };
  var ASIDE={
    title:'Everything you need, delivered to you.',
    lead:'One account to shop from trusted vendors and, when you are ready, to open your own store.',
    points:['Food, fashion, gadgets, books and more','Every vendor is reviewed before they sell','Get your order by delivery or pickup']
  };

  function showNote(type,text){
    note.className='note '+(type==='error'?'error':'ok');
    note.textContent=text;
    note.hidden=false;
  }
  function clearNote(){note.hidden=true;note.textContent='';resendBtn.hidden=true}

  function render(){
    var c=COPY[mode];
    $('title').textContent=c[0];
    $('sub').textContent=c[1];
    $('submitLabel').textContent=c[2];
    $('asideTitle').textContent=ASIDE.title;
    $('asideLead').textContent=ASIDE.lead;
    $('points').innerHTML=ASIDE.points.map(function(t){return '<li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>'+t+'</li>'}).join('');
    document.title=c[0]+' — FUNAAB Marketplace';

    document.querySelectorAll('#tabs button').forEach(function(b){
      b.setAttribute('aria-pressed',b.dataset.mode===mode);
    });
    var authMode=(mode==='signin'||mode==='signup');
    $('tabs').hidden=!authMode;

    document.querySelectorAll('[data-modes]').forEach(function(el){
      var show=el.dataset.modes.split(' ').indexOf(mode)>-1;
      el.hidden=!show;
      el.querySelectorAll('input,select').forEach(function(i){i.disabled=!show});
    });

    $('pwLabel').textContent=(mode==='update')?'New password':'Password';
    pw.autocomplete=(mode==='signin')?'current-password':'new-password';
    pw.placeholder=(mode==='signin')?'Enter your password':'Create a password';
    if(mode==='signin')pw.removeAttribute('minlength');else pw.setAttribute('minlength','8');

    // keep location.hash so Supabase can still read the OAuth / recovery tokens
    if(authMode&&window.history&&history.replaceState&&location.protocol!=='file:'){
      history.replaceState(null,'','?mode='+mode+location.hash);
    }
  }

  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click',function(){mode=b.dataset.mode;clearNote();render()});
  });
  $('forgot').addEventListener('click',function(){mode='reset';clearNote();render()});
  $('backToSignin').addEventListener('click',function(){mode='signin';clearNote();render()});

  // Password reveal
  var eye=$('eye'),eyeUse=$('eyeUse');
  eye.addEventListener('pointerdown',function(e){e.preventDefault()}); // keep keyboard open on phones
  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.setAttribute('aria-label',show?'Hide password':'Show password');
    eye.setAttribute('aria-pressed',show);
    eyeUse.setAttribute('href',show?'#i-eye-off':'#i-eye');
  });

  function setLoading(on){
    submitBtn.disabled=on;googleBtn.disabled=on;
    if(on){$('submitLabel').textContent='Please wait...'}else{render()}
  }

  // Turn Supabase errors into plain messages (real error is logged to the console for debugging)
  function friendly(err){
    var m=(err&&err.message)||'Something went wrong. Please try again.';
    var code=(err&&err.code)||'';
    if(/invalid login/i.test(m))return 'Email or password is incorrect.';
    if(/not confirmed/i.test(m)||code==='email_not_confirmed')return 'Confirm your email first. Check your inbox (and spam) for the link.';
    if(/already registered/i.test(m)||code==='user_already_exists')return 'An account with this email already exists. Sign in instead.';
    if(/rate limit/i.test(m)||/security purposes/i.test(m)||code==='over_email_send_rate_limit'||code==='over_request_rate_limit')return 'Too many attempts. Please wait a minute and try again.';
    if(/sending confirmation email/i.test(m)||/sending.*email/i.test(m))return 'We could not send your confirmation email right now. Please try again in a few minutes.';
    if(/database error/i.test(m))return 'We could not create your account right now. Please try again shortly.';
    if(/password/i.test(m)&&/(least|weak|short|characters)/i.test(m))return 'Choose a stronger password of at least 8 characters.';
    if(/valid email|invalid.*email|email.*invalid/i.test(m))return 'Enter a valid email address.';
    if(/failed to fetch|networkerror|network request/i.test(m))return 'Network problem. Check your connection and try again.';
    return m;
  }
  function notConnected(){
    showNote('error','Auth is not connected yet. Add your Supabase URL and anon key at the top of the script.');
  }
  function goHome(){location.href=HOME}
  // Absolute URL of this page. Used for email links, so it must never be a file:// path.
  function selfUrl(m){
    var base=AUTH_PAGE_URL||(location.origin+location.pathname);
    return base+'?mode='+m;
  }
  function hostedOk(){
    if(AUTH_PAGE_URL)return true;
    if(location.protocol==='http:'||location.protocol==='https:')return true;
    showNote('error','Open this page from your live site or localhost, not as a local file, so the confirmation link can return here.');
    return false;
  }

  // Resend confirmation (60s cooldown to avoid email rate limits)
  function startCooldown(){
    var left=60;
    resendBtn.disabled=true;
    var t=setInterval(function(){
      left--;
      if(left<=0){clearInterval(t);resendBtn.disabled=false;resendBtn.textContent='Resend confirmation email'}
      else resendBtn.textContent='Resend in '+left+'s';
    },1000);
    resendBtn.textContent='Resend in '+left+'s';
  }
  resendBtn.addEventListener('click',async function(){
    if(!sb||!pendingEmail||resendBtn.disabled)return;
    startCooldown();
    var r=await sb.auth.resend({type:'signup',email:pendingEmail,options:{emailRedirectTo:selfUrl('signin')}});
    if(r.error){console.error('Resend error:',r.error);showNote('error',friendly(r.error));resendBtn.hidden=false}
    else{showNote('ok','Confirmation email sent again. Check your inbox and spam folder.');resendBtn.hidden=false}
  });

  // Email + password
  form.addEventListener('submit',async function(e){
    e.preventDefault();clearNote();
    if(!form.reportValidity())return;
    if(!sb){notConnected();return}
    if((mode==='signup'||mode==='reset')&&!hostedOk())return;
    setLoading(true);
    var keepLocked=false;
    try{
      var email=$('email').value.trim();
      if(mode==='signin'){
        var r1=await sb.auth.signInWithPassword({email:email,password:pw.value});
        if(r1.error)throw r1.error;
        goHome();keepLocked=true;return;
      }
      if(mode==='signup'){
        var meta={full_name:$('fullName').value.trim(),role:'customer'};
        var r2=await sb.auth.signUp({email:email,password:pw.value,options:{data:meta,emailRedirectTo:selfUrl('signin')}});
        if(r2.error)throw r2.error;
        // Supabase returns a fake user with no identities when the email is already registered
        if(r2.data.user&&r2.data.user.identities&&r2.data.user.identities.length===0){
          showNote('error','An account with this email already exists. Sign in instead.');return;
        }
        if(r2.data.session){goHome();keepLocked=true;return}
        pendingEmail=email;
        showNote('ok','Check your email. We sent a confirmation link to '+email+'. It may take a minute, and check your spam folder too.');
        resendBtn.hidden=false;
        form.reset();return;
      }
      if(mode==='reset'){
        var r3=await sb.auth.resetPasswordForEmail(email,{redirectTo:selfUrl('update')});
        if(r3.error)throw r3.error;
        showNote('ok','If that email has an account, a reset link is on its way.');return;
      }
      if(mode==='update'){
        var r4=await sb.auth.updateUser({password:pw.value});
        if(r4.error)throw r4.error;
        showNote('ok','Password updated. Taking you in...');
        keepLocked=true;
        setTimeout(goHome,1200);return;
      }
    }catch(err){
      console.error('Auth error:',err);
      showNote('error',friendly(err));
      // Unconfirmed account trying to sign in: offer to resend the link
      if(mode==='signin'&&(/not confirmed/i.test((err&&err.message)||'')||(err&&err.code)==='email_not_confirmed')){
        pendingEmail=$('email').value.trim();
        resendBtn.hidden=false;
      }
    }finally{
      if(!keepLocked)setLoading(false);
    }
  });

  // Google
  googleBtn.addEventListener('click',async function(){
    clearNote();
    if(!sb){notConnected();return}
    if(!hostedOk())return;
    try{localStorage.setItem('fm_oauth','1')}catch(_){}
    var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:AUTH_PAGE_URL||(location.origin+location.pathname)}});
    if(r.error){console.error('Google error:',r.error);showNote('error',friendly(r.error))}
  });

  // Already signed in, coming back from the confirmation email, or coming back from Google
  (async function(){
    if(!sb||mode==='update')return;
    // Work out BEFORE any await whether we are returning from an email link or Google
    var fromGoogle=false;
    try{fromGoogle=localStorage.getItem('fm_oauth')==='1'}catch(_){}
    var returning=/access_token=|error_description=/.test(location.hash)||fromGoogle;

    var s=await sb.auth.getSession();
    var session=s.data&&s.data.session;
    if(!session)return;

    // Verify the session with the server; a stale/deleted-user session must not trap the page
    var chk=await sb.auth.getUser();
    if(chk.error||!chk.data||!chk.data.user){
      await sb.auth.signOut();
      return;
    }
    var user=chk.data.user;

    if(returning){
      try{localStorage.removeItem('fm_oauth')}catch(_){}
      goHome();
      return;
    }

    // Opened normally while already signed in: do NOT bounce away, let the person choose
    showNote('ok','You are already signed in as '+(user.email||'your account')+'.');
    var wrap=document.createElement('div');
    wrap.style.cssText='display:flex;gap:16px;justify-content:center;margin:-4px 0 14px';
    var go=document.createElement('button');
    go.type='button';go.className='link';go.textContent='Continue to the site';
    go.addEventListener('click',goHome);
    var out=document.createElement('button');
    out.type='button';out.className='link';out.textContent='Sign out';
    out.addEventListener('click',async function(){await sb.auth.signOut();clearNote();wrap.remove()});
    wrap.appendChild(go);wrap.appendChild(out);
    note.parentNode.insertBefore(wrap,note.nextSibling);
  })();

  render();
})();
</script>
</body>
</html>
