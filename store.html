<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAMPZA Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF7628;--c:#252525;--bg:#FFFFFF;--g:#F4F4F4;--m:#6b6b6b;--b:#e8e8e8;--r:14px;--pad:14px;--gap:10px;--hh:160px;--lh:54px;color-scheme:light}
@media(min-width:768px){:root{--pad:20px;--gap:14px;--hh:200px;--lh:64px}}
@media(min-width:1024px){:root{--pad:24px;--hh:240px}}
*{box-sizing:border-box;margin:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{font:400 14px/1.4 Inter,system-ui,sans-serif;color:var(--c);background:var(--bg);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
h1,h2,h3{font-family:Sora,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:0 var(--pad)}
@media(min-width:768px){.wrap{max-width:760px}}
@media(min-width:1024px){.wrap{max-width:1100px}}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding:8px 0 6px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.logo img{height:var(--lh);width:auto;max-width:70vw;object-fit:contain}
.logo b{font:700 28px/1 Sora;letter-spacing:.5px}
.bell{position:relative;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bell svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell span{position:absolute;top:1px;right:1px;background:var(--o);color:#fff;font:700 10px Inter;min-width:18px;height:18px;padding:0 3px;border-radius:9px;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--g);border:1px solid var(--b);border-radius:999px;padding:0 14px;margin-top:6px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:0;font:inherit;font-size:16px;color:var(--c);width:100%}
.search input::placeholder{color:var(--m);font-size:14px}
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-top:12px;touch-action:pan-y;user-select:none;height:var(--hh)}
.track{position:relative;height:100%}.snap .sl{transition:none!important}
.sl{position:absolute;inset:0;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .7s;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.sl::after{content:"";position:absolute;right:-50px;top:-30px;width:200px;height:240px;background:var(--a);border-radius:45% 55% 40% 60%;transform:rotate(-18deg);opacity:.95}
.sl>*{position:relative;z-index:1}
.sl .t{color:var(--o);font:600 13px Inter}
.sl h2{font-size:clamp(18px,5vw,24px);line-height:1.2;max-width:58%}
.sl .em{position:absolute;right:14px;top:50%;transform:translateY(-52%);font-size:clamp(56px,16vw,88px);z-index:1;filter:drop-shadow(0 6px 10px #0006)}
.btn{background:var(--o);color:#fff;font-weight:600;border-radius:10px;padding:8px 14px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--g);color:var(--c)}
.btn.full{display:block;width:100%;padding:13px;text-align:center;text-decoration:none;margin-top:10px}
.btn.danger{background:#d92d20}
.sl .btn{align-self:flex-start;margin-top:6px;font-size:13px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3}
.dots i{width:6px;height:6px;border-radius:99px;background:#ffffff80;transition:.3s}
.dots i.on{background:#fff;width:16px}
.cats,.row{display:flex;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 calc(-1*var(--pad));padding-left:var(--pad);padding-right:0;scroll-padding-inline:var(--pad);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cats::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.cats::after,.row::after{content:"";flex:0 0 calc(var(--pad) - var(--gap) + 1px)}
.cats{padding-top:14px;padding-bottom:12px;border-bottom:1px solid var(--b)}
.cat{flex:0 0 68px;scroll-snap-align:start;text-align:center;font-size:11.5px;line-height:1.2}
.cat i{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#FF762818;font-size:25px;margin:0 auto 6px;font-style:normal;transition:transform .15s}
.cat span{display:block;min-height:2.4em;overflow-wrap:anywhere}
.cat:active i{transform:scale(.92)}
@media(min-width:1024px){.cat{flex-basis:92px;font-size:12.5px}.cat i{width:64px;height:64px;font-size:28px}.cats{justify-content:safe center}}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;gap:10px}
.sh h2{font-size:17px}.sh a{color:var(--o);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;padding:6px 0}
.sh2{font-size:16px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{border:1px solid var(--b);border-radius:var(--r);padding:8px;position:relative;display:flex;flex-direction:column;gap:6px;background:var(--bg);height:100%}
.pimg{aspect-ratio:1/.85;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:clamp(36px,11vw,50px);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain;padding:6px}
@media(min-width:768px){.pimg{font-size:56px}}
.disc{position:absolute;top:12px;left:12px;background:var(--o);color:#fff;font:600 11px Inter;padding:2px 8px;border-radius:99px;z-index:1}
.hb{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);box-shadow:0 1px 4px #0002;display:grid;place-items:center;z-index:1}
.hb svg{width:17px;height:17px;fill:none;stroke:var(--c);stroke-width:2;transition:.2s}
.hb.on svg{fill:var(--o);stroke:var(--o);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.card h3{font:500 13.5px/1.3 Inter;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;overflow-wrap:anywhere}
.pr{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:auto;overflow-wrap:anywhere}
.old{color:var(--m);text-decoration:line-through;font-size:11px;font-weight:400}
.card .btn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;padding:0 6px;min-height:40px}
.card .btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;flex:none}
.row{align-items:stretch;padding-bottom:6px}
.row .card{flex:0 0 max(124px,42%);scroll-snap-align:start;height:auto}
@media(min-width:768px){.row .card{flex-basis:calc((100% - 2*var(--gap))/3.4)}}
@media(min-width:1024px){.row .card{flex-basis:calc((100% - 3*var(--gap))/4.4)}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--b);z-index:30;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1 1 0;display:grid;justify-items:center;gap:4px;padding:10px 0 8px;font:500 11px Inter;color:var(--m);position:relative;white-space:nowrap}
@media(max-width:360px){nav button{font-size:10px}}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
nav .on{color:var(--o);font-weight:600}nav .on svg{fill:var(--o)}
nav .cb{position:absolute;top:1px;left:calc(50% + 4px);background:var(--o);color:#fff;font:700 10px Inter;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.nt{padding:12px;border-radius:12px;border:1px solid var(--b);margin-bottom:10px;display:grid;gap:4px}.nt.un{background:#FF762812;border-color:#FF762866}.nt small,small{color:var(--m)}
.soon{text-align:center;padding:60px 16px;color:var(--m)}.soon b{display:block;font-size:38px;margin-bottom:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}.top h1{font-size:22px;overflow-wrap:anywhere}
.sub{color:var(--m);margin:-6px 0 14px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
@media(min-width:768px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1024px){.cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ccard{display:block;width:100%;text-align:left;border:1px solid var(--b);border-radius:var(--r);overflow:hidden;background:var(--bg);transition:transform .15s,box-shadow .15s}
.ccard:active{transform:scale(.98)}
.ccard .im{height:92px;display:grid;place-items:center;font-size:34px;letter-spacing:3px;background:linear-gradient(135deg,#FF76280f,#f4f4f4)}
.ccard .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 10px 12px}
.ccard b{display:block;font:600 14px/1.2 Sora}
.cv{width:30px;height:30px;border-radius:50%;background:#FF762820;color:var(--o);display:grid;place-items:center;font:700 20px/1 Inter;flex:none;padding-bottom:2px}
.line{display:flex;gap:10px;border:1px solid var(--b);border-radius:var(--r);padding:8px;margin-bottom:10px;align-items:center}
.line .pimg{width:68px;flex:none;aspect-ratio:1;font-size:32px}
.line .mid{flex:1;display:grid;gap:3px}.line b{overflow-wrap:anywhere}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--g);border-radius:99px}
.qty button{width:34px;height:34px;font-size:18px;border-radius:50%}.qty span{min-width:22px;text-align:center;font-weight:600}
.rm{color:var(--m);font-size:12px;text-decoration:underline;padding:4px}
.sum{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--bg);border:1px solid var(--b);border-radius:var(--r);padding:12px;display:grid;gap:10px;box-shadow:0 -4px 16px #0000000d}
.sum div{display:flex;justify-content:space-between;font-weight:700;font-size:16px}.sum .btn{padding:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--b)}.set small{display:block}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw s{position:absolute;inset:0;background:#cfcfcf;border-radius:99px;transition:.2s;pointer-events:none}
.sw s::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+s{background:var(--o)}.sw input:checked+s::after{transform:translateX(18px)}
/* account */
.prof{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#FF76280d;border:1px solid #FF762826;border-radius:var(--r);padding:14px}
.av{width:64px;height:64px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font:700 26px Sora;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.pm{flex:1;display:grid;gap:3px;justify-items:start}.pm b{font:600 17px Sora;overflow-wrap:anywhere}.pm small{overflow-wrap:anywhere}
.badge{background:#FF762822;color:var(--o);font:600 12px Inter;padding:3px 10px;border-radius:99px}
.badge.no{background:#fde8e6;color:#d92d20}
.qt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.qt button{border:1px solid var(--b);background:#FF76280a;border-radius:var(--r);padding:12px 2px 10px;display:grid;justify-items:center;gap:2px;font-weight:600;font-size:12.5px}
.qt small{font-size:11px;font-weight:400}
.ico{width:42px;height:42px;border-radius:50%;background:#FF762818;display:grid;place-items:center;margin-bottom:4px;flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:var(--o);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box{border:1px solid var(--b);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.pad{padding:12px;display:grid;gap:8px}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--b)}
.box .li:last-child{border-bottom:0}
.li .ic{width:26px;flex:none}.li .ic svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.li>span:nth-child(2){flex:1;display:grid}.li b{font-weight:500;font-size:15px}
.li.tint{background:#FF76280d;border:1px solid #FF762826;border-radius:var(--r);margin-top:14px}
.li.tint .ic svg{stroke:var(--o)}
.out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border-radius:var(--r);background:#ff76281a;color:#e5560b;font-weight:600}
.out svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{text-align:center;color:var(--m);font-size:12px;margin-top:18px}
/* forms + pages */
.fld{display:grid;gap:6px;margin-bottom:12px}.fld label{font-weight:600;font-size:13px}
input,textarea,select{font:inherit;font-size:16px;color:var(--c);border:1px solid var(--b);border-radius:10px;padding:11px 12px;background:var(--bg);width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px #FF762826}
input:disabled{background:var(--g);color:var(--m)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{border-top:1px solid var(--b);padding-top:8px;font-size:16px}
.st{background:#FF762822;color:var(--o);font:600 11px Inter;padding:3px 9px;border-radius:99px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:8px}
.opt input{width:auto;accent-color:var(--o)}
.bal{background:var(--o);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px}.bal small{display:block;color:#fff;opacity:.85}.bal b{font:700 30px Sora}
details{border-bottom:1px solid var(--b);padding:13px 0}summary{font-weight:600;cursor:pointer}details p{margin-top:8px;color:var(--m)}
.terms h3{font-size:15px;margin:16px 0 4px}.terms p{color:var(--m)}
.warn{background:#fde8e6;color:#9b1c14;border-radius:var(--r);padding:12px;margin-bottom:14px}
[data-open]{cursor:pointer}
#aibox{position:fixed;left:12px;right:12px;max-width:380px;margin-left:auto;bottom:calc(88px + env(safe-area-inset-bottom,0px));height:min(58vh,440px);background:var(--bg);border:1px solid var(--b);border-radius:18px;box-shadow:0 10px 34px #00000030;z-index:40;display:flex;flex-direction:column;overflow:hidden}
#aibox[hidden]{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--o);color:#fff}.ah b{font:600 15px Sora}.ah button{color:#fff;font-size:26px;line-height:1;padding:0 4px}
#aibox .chat{flex:1;overflow-y:auto;padding:12px;align-content:start;overscroll-behavior:contain}
#aibox .chips{padding:0 12px;margin:0 0 8px}
.cbar2{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--b)}.cbar2 input{border-radius:99px;padding:10px 14px}.cbar2 .btn{border-radius:99px;padding:0 16px}
.acon{text-align:center;padding:0 0 8px}.acon a{color:var(--o);font-weight:600}
body.aiopen .fab{display:none}
.fab{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:7px;background:var(--o);color:#fff;border-radius:99px;padding:12px 18px 12px 14px;font-weight:600;box-shadow:0 6px 18px #ff762873;transition:transform .15s}
.fab:active{transform:scale(.95)}.fab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chat{display:grid;gap:10px;padding-bottom:10px}
.bub{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.bub.bot{background:var(--g);border-bottom-left-radius:4px;justify-self:start}
.bub.me{background:var(--o);color:#fff;border-bottom-right-radius:4px;justify-self:end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chips button{border:1px solid var(--o);color:var(--o);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;background:var(--bg)}
.cbar{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0;z-index:5}.cbar input{border-radius:99px}.cbar .btn{border-radius:99px;padding:0 20px}
.pd-img{position:relative;aspect-ratio:1/.8;border-radius:var(--r);background:var(--g);display:grid;place-items:center;font-size:110px;overflow:hidden}
.pd-img img{width:100%;height:100%;object-fit:contain;padding:12px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}.thumbs button{flex:0 0 58px;height:58px;border:1px solid var(--b);border-radius:10px;overflow:hidden;background:var(--g)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pd-n{font:600 19px/1.3 Sora;margin-top:14px;overflow-wrap:anywhere}
.pd-p{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:8px 0}.pd-p b{font:700 25px Sora}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:var(--g);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:500}.tag.ok{background:#e6f6ec;color:#1a7f43}.tag.no{background:#fde8e6;color:#b42318}
.pdesc{color:#444;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.spec{width:100%;border-collapse:collapse}.spec td{padding:11px 12px;border-bottom:1px solid var(--b);vertical-align:top;overflow-wrap:anywhere}.spec tr:last-child td{border:0}.spec td:first-child{color:var(--m);width:40%;background:#fafafa}
.pbar{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);border:1px solid var(--b);border-radius:var(--r);padding:10px;margin-top:18px;box-shadow:0 -4px 16px #0000000d;z-index:5}.pbar .btn{flex:1;padding:13px;text-align:center}.pbar .btn.alt{background:#252525}
.btn[disabled]{opacity:.5;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#252525;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header><div class="wrap">
 <div class="hrow">
  <button class="logo" data-go="home" aria-label="KAMPZA home"><img src="kampza-logo.png" alt="KAMPZA - Find It. Get It. Love It." onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'KAMPZA'}))"></button>
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 8H4c0-1 2-2 2-8zM10 20a2 2 0 004 0"/></svg><span id="bb" hidden></span></button>
 </div>
 <form class="search" id="sf" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Search for products, brands and more…" aria-label="Search products" autocomplete="off" enterkeyhint="search"></form>
</div></header>

<main class="wrap" id="app"></main>

function infoView(){return pgHead('Personal Information')+`${fld('fn','Full name',U.name,'autocomplete="name"')}${fld('em','Email',U.email,'disabled')}${fld('ph','Phone number',U.phone,'type="tel" inputmode="tel" autocomplete="tel"')}${area('ad','Delivery address',U.meta.address||'','Hostel, room, campus')}<button class="btn full" data-saveinfo>Save changes</button>`}
function securityView(){return pgHead('Security')+`<div class="set"><div><b>Email verification</b><small>${U.verified?'Your email is verified':'Not verified yet'}</small></div>${U.verified?'<span class="badge">✓ Verified</span>':'<button class="btn" data-resend>Resend link</button>'}</div><h2 class="sh2">Change password</h2>${fld('np','New password','','type="password" autocomplete="new-password" placeholder="At least 8 characters"')}${fld('cp','Confirm new password','','type="password" autocomplete="new-password"')}<button class="btn full" data-pw>Update password</button>`}
function prefsView(){return pgHead('Notifications')+`<label class="set"><div><b>Daily deals email</b><small>One email each morning with today’s Flash Deals</small></div><span class="sw"><input type="checkbox" data-pref="daily" ${S.prefs.daily?'checked':''}><s></s></span></label><label class="set"><div><b>Other email updates</b><small>Welcome and account messages</small></div><span class="sw"><input type="checkbox" data-pref="email" ${S.prefs.email?'checked':''}><s></s></span></label><p style="margin-top:14px"><small>Emails are sent automatically to ${esc(U.email)}.</small></p>`}
function termsView(){return pgHead('Terms &amp; Conditions')+`<div class="terms"><h3>1. Using KAMPZA</h3><p>You must provide accurate details and keep your login private. You are responsible for activity on your account.</p><h3>2. Orders and pricing</h3><p>Prices are in Nigerian Naira. We may cancel an order if an item is unavailable or a price was listed in error, and refund any payment made.</p><h3>3. Wallet</h3><p>Wallet funds can only be spent on KAMPZA orders and are not withdrawable unless required by law.</p><h3>4. Delivery</h3><p>Delivery times are estimates. Please provide a correct address and phone number.</p><h3>5. Privacy</h3><p>We use your name, email, phone and address only to run your account, process orders and send messages you opted into. You can turn emails off or delete your account at any time.</p><h3>6. Contact</h3><p>Questions? Email ${esc(SUPPORT_EMAIL)}.</p></div>`}
function deleteView(){return pgHead('Delete Account')+`<div class="warn"><b>This cannot be undone.</b> Your profile, orders, quotes, wishlist and wallet balance will be removed permanently.</div>${fld('dc','Type DELETE to confirm','','autocapitalize="characters" autocomplete="off"')}<button class="btn full danger" data-del>Delete my account</button>`}
function helpView(){const f=(a,b)=>`<details><summary>${a}</summary><p>${b}</p></details>`;return pgHead('Help &amp; Support')+'<button class="li tint" style="margin:0 0 6px" data-ai><span class="ic">'+ic('bot')+'</span><span><b>Ask KAMPZA AI</b><small>Instant answers, any time</small></span><span class="cv">›</span></button>'+f('How do I place an order?','Add items to your cart, tap Checkout, enter your phone and address, then choose Wallet or Pay on delivery.')+f('How do I fund my wallet?','Go to Account → Wallet, enter an amount and pay securely with Paystack.')+f('Can’t find a product?','Use My Quotes to describe what you need and we’ll reply with a price.')+f('I didn’t get an email','Check spam, confirm your email is verified under Security, then make sure Daily deals email is on in Notifications.')+`<a class="btn full" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">Chat on WhatsApp</a><a class="btn full ghost" href="mailto:${SUPPORT_EMAIL}">Email support</a>`}
const AIHI='Hi! I’m KAMPZA AI 👋 Ask me about products, orders, your wallet, payments or delivery.';
let AIOPEN=false,AIBUSY=false;
const AIQ=['Where is my order?','How do I fund my wallet?','How does delivery work?','Recommend something under ₦30,000'];
function aiSync(){const root=tab==='home'&&!sub&&!pg&&!prod&&!q.trim();if(!root)AIOPEN=false;$('#aibox').hidden=!AIOPEN;document.body.classList.toggle('aiopen',AIOPEN)}
function aiRender(){const c=$('#chat');c.innerHTML=`<div class="bub bot">${AIHI}</div>`+S.ai.map(m=>`<div class="bub ${m.r==='u'?'me':'bot'}">${esc(m.t)}</div>`).join('');
 $('#chips').innerHTML=S.ai.length?'':AIQ.map(t=>`<button data-aiq="${esc(t)}">${esc(t)}</button>`).join('');
 $('#aiwa').href='https://wa.me/'+WHATSAPP;$('#aiem').href='mailto:'+SUPPORT_EMAIL;c.scrollTop=c.scrollHeight}
function aiOpen(){AIOPEN=true;if(!(tab==='home'&&!sub&&!pg&&!prod&&!q.trim()))go2('home');aiRender();aiSync()}
async function askAI(text){
 text=(text||'').trim().slice(0,500);if(!text||AIBUSY)return;AIBUSY=true;
 const chat=$('#chat'),add=(c,t)=>{const d=document.createElement('div');d.className='bub '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d};
 $('#chips').innerHTML='';
 S.ai.push({r:'u',t:text});add('me',text);$('#ain').value='';
 const w=add('bot','…');
 try{const j=await callFn(AI_FN,{token:TOKEN,messages:S.ai.slice(-10).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t})),ctx:{name:U.name.split(' ')[0],wallet:S.wallet.bal,orders:S.orders.slice(0,5).map(o=>({id:o.id,status:o.status,total:o.total,date:dt(o.at),pay:o.pay,items:o.items.map(i=>i.q+'x '+i.n)}))}});
  const t=j.ok?j.reply:'Sorry, I can’t answer right now. Please message us on WhatsApp or email.';if(!j.ok)console.error('KAMPZA AI',j);w.textContent=t;if(j.ok)S.ai.push({r:'a',t})}
 catch(err){console.error('KAMPZA AI',err);w.textContent='I can’t connect right now. Please try again or message us on WhatsApp.'}
 chat.scrollTop=chat.scrollHeight;S.ai=S.ai.slice(-30);store();AIBUSY=false}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ain'){e.preventDefault();askAI(e.target.value)}});
const PG={orders:ordersView,checkout:checkoutView,quotes:quotesView,wallet:walletView,info:infoView,security:securityView,prefs:prefsView,terms:termsView,delete:deleteView,help:helpView};

/* ================= SEARCH / LISTS ================= */
const match=p=>{const h=(p.n+' '+(p.c||'')).toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>h.includes(t))};
function listItems(){
 if(sub==='flash')return ['Flash Deals',flash()];
 if(sub==='rec')return ['Recommended For You',recs()];
 if(sub==='all')return ['All Products',P];
 return [esc(sub.cat),P.filter(p=>p.c===sub.cat)]}

/* ================= RENDER ================= */
function nav(){const n=cartCount();
 $('#nav').innerHTML=NAV.map(x=>`<button data-t="${x[0]}" class="${x[0]==tab?'on':''}" aria-label="${x[1]}" ${x[0]==tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[x[0]]}</svg>${x[1]}${x[0]=='cart'&&n?`<span class="cb">${n>99?'99+':n}</span>`:''}</button>`).join('')}
function view(){
 stop();let h;
 if(q.trim()){h=listView('Results for “'+esc(q.trim())+'”',P.filter(match))}
 else if(prod&&byId(prod))h=prodView(prod);
 else if(pg&&PG[pg])h=PG[pg]();
 else if(sub&&tab==='home'){const[t,it]=listItems();h=listView(t,it)}
 else h=tab==='home'?home():tab==='cats'?catsView():tab==='wish'?wishView():tab==='cart'?cartView():tab==='account'?accountView():notifsView();
 $('#app').innerHTML=h;
 if(tab==='home'&&!sub&&!pg&&!prod&&!q.trim())start();aiSync()}
const snap=()=>({tab,sub,pg,prod});
function draw(h=true){nav();view();scrollTo(0,0);if(h){const t=snap();if(JSON.stringify(history.state)!==JSON.stringify(t))history.pushState(t,'')}}
function go2(t,s=null){tab=t;sub=s;pg=null;prod=null;q='';$('#q').value='';draw()}

/* ================= EVENTS ================= */
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)go2(b.dataset.t)};
$('#bell').onclick=()=>go2('notifs');
$('#sf').onsubmit=e=>{e.preventDefault();$('#q').blur()};
$('#q').addEventListener('input',e=>{q=e.target.value;view();if(!q.trim())nav()});
document.addEventListener('error',e=>{const i=e.target;if(i.tagName==='IMG'&&i.dataset.e){i.replaceWith(Object.assign(document.createElement('span'),{textContent:i.dataset.e}))}},true);
function credit(a,t){S.wallet.bal+=a;S.wallet.tx.unshift({t,a,at:Date.now()});store();notif('Wallet funded',fmt(a)+' added to your wallet.');if(pg==='wallet')view()}
document.addEventListener('click',async e=>{
 const g=s=>e.target.closest(s);let x;
 if(x=g('[data-w]')){const k=x.dataset.w,on=!S.wish.includes(k);S.wish=on?[...S.wish,k]:S.wish.filter(i=>i!==k);store();
  document.querySelectorAll(`[data-w="${k}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  toast(on?'Saved to wishlist':'Removed from wishlist');if(tab==='wish'&&!q.trim()&&!sub)view();return}
 if(x=g('[data-add]')){const id=x.dataset.add;if(!byId(id))return;if(byId(id).st===0){toast('Out of stock');return}S.cart[id]=(S.cart[id]||0)+1;store();nav();toast('Added to cart ('+S.cart[id]+')');return}
 if(x=g('[data-qty]')){const id=x.dataset.qty,n=(S.cart[id]||0)+Number(x.dataset.d);if(n<=0)delete S.cart[id];else S.cart[id]=Math.min(n,99);store();nav();view();return}
 if(x=g('[data-rm]')){delete S.cart[x.dataset.rm];store();nav();view();return}
 if(x=g('[data-gi]')){const m=$('#gmain');if(m)m.src=x.dataset.gi;return}
 if(x=g('[data-buy]')){const id=x.dataset.buy;S.cart[id]=S.cart[id]||1;store();tab='cart';pg='checkout';prod=null;sub=null;draw();return}
 if(x=g('[data-open]')){if(!byId(x.dataset.open))return;prod=x.dataset.open;q='';$('#q').value='';draw();return}
 if(g('[data-ai]')){aiOpen();return}
 if(g('[data-aiclose]')){AIOPEN=false;aiSync();return}
 if(x=g('[data-aiq]')){askAI(x.dataset.aiq);return}
 if(g('[data-aisend]')){askAI($('#ain').value);return}
 if(x=g('[data-cat]')){tab='home';sub={cat:x.dataset.cat};pg=null;prod=null;q='';$('#q').value='';draw();return}
 if(x=g('[data-list]')){tab='home';sub=x.dataset.list;pg=null;prod=null;q='';$('#q').value='';draw();return}
 if(x=g('[data-go]')){go2(x.dataset.go);return}
 if(x=g('[data-pg]')){pg=x.dataset.pg;draw();return}
 if(g('[data-pgback],[data-back],[data-hback]')){history.back();return}
 if(g('[data-read]')){S.notifs.forEach(n=>n.r=1);store();badges();view();return}
 if(g('[data-signout]')){OUT=true;sb?.auth.signOut();return}
 if(g('[data-place]')){
  const ph=v('ph'),ad=v('ad'),pay=document.querySelector('input[name=pay]:checked').value,t=cartTotal();
  if(ph.length<7||ad.length<5){toast('Enter your phone number and delivery address');return}
  if(pay==='wallet'&&S.wallet.bal<t){toast('Wallet balance is too low. Fund your wallet first.');return}
  const items=Object.keys(S.cart).filter(byId).map(id=>({n:byId(id).n,q:S.cart[id],p:byId(id).p}));
  const o={id:'KZ-'+Date.now().toString(36).toUpperCase(),at:Date.now(),items,total:t,pay,ph,ad,status:'Processing'};
  S.orders.unshift(o);if(pay==='wallet'){S.wallet.bal-=t;S.wallet.tx.unshift({t:'Order '+o.id,a:-t,at:o.at})}
  S.cart={};U.phone=ph;U.meta.address=ad;U.meta.phone=ph;store();
  sb?.auth.updateUser({data:{phone:ph,address:ad}});
  notif('Order placed ✅',o.id+' · '+fmt(t));tab='account';pg='orders';draw();toast('Order placed');return}
 if(g('[data-quote]')){
  const item=v('qi');if(item.length<3){toast('Describe what you need');return}
  const id='QT-'+Date.now().toString(36).toUpperCase();
  S.quotes.unshift({id,item,qty:Math.max(1,parseInt(v('qq'))||1),budget:v('qb'),note:v('qn'),at:Date.now(),status:'Pending'});
  store();notif('Quote requested',id+' · '+item);draw();toast('Quote request sent');return}
 if(g('[data-fund]')){
  const a=Math.floor(Number(v('amt')));if(!(a>=100)){toast('Minimum is ₦100');return}
  if(PAYSTACK_KEY.startsWith('YOUR_')||!window.PaystackPop){toast('Payments are not set up yet');return}
  PaystackPop.setup({key:PAYSTACK_KEY,email:U.email,amount:a*100,currency:'NGN',ref:'KZ'+Date.now(),
   callback:r=>credit(a,'Wallet top-up ('+r.reference+')'),onClose:()=>{}}).openIframe();return}
 if(g('[data-saveinfo]')){
  const name=v('fn'),ph=v('ph'),ad=v('ad');if(name.length<2){toast('Enter your full name');return}
  const d={full_name:name,phone:ph,address:ad};
  if(sb){const{error}=await sb.auth.updateUser({data:d});if(error){toast(error.message);return}}
  U.name=name;U.phone=ph;Object.assign(U.meta,d);toast('Details saved');pg=null;draw();return}
 if(g('[data-resend]')){
  const{error}=await sb.auth.resend({type:'signup',email:U.email});toast(error?error.message:'Verification link sent to '+U.email);return}
 if(g('[data-pw]')){
  const a=$('#np').value,b=$('#cp').value;
  if(a.length<8){toast('Use at least 8 characters');return}if(a!==b){toast('Passwords do not match');return}
  const{error}=await sb.auth.updateUser({password:a});if(error){toast(error.message);return}
  $('#np').value=$('#cp').value='';toast('Password updated');return}
 if(g('[data-del]')){
  if(v('dc')!=='DELETE'){toast('Type DELETE to confirm');return}
  const{error}=await sb.rpc('delete_my_account');if(error){toast('Could not delete your account. Contact support.');return}
  try{localStorage.removeItem('kz_n_'+U.id)}catch{}OUT=true;await sb.auth.signOut()}
});
document.addEventListener('change',async e=>{
 const c=e.target.closest('[data-pref]');if(!c)return;
 const k=c.dataset.pref;S.prefs[k]=c.checked;store();
 if(sb){try{await sb.auth.updateUser({data:k==='daily'?{email_daily:c.checked}:{email_updates:c.checked}})}catch{toast('Could not sync preference')}}
 toast(k==='daily'?(c.checked?'Daily deals email on':'Daily deals email off'):(c.checked?'Email updates on':'Email updates off'))});

/* ================= HERO CAROUSEL ================= */
let idx=0,timer,drag=null;const N=SLIDES.length;
function goTo(i){if(!$('#track'))return;idx=((i%N)+N)%N;document.querySelectorAll('.sl').forEach((s,j)=>{let o=((j-idx)%N+N)%N;if(o>N/2)o-=N;s.style.transform=`translateX(${o*100}%)`;s.style.opacity=Math.abs(o)>1?0:1;s.setAttribute('aria-hidden',o!==0)});
 document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j==idx))}
function start(){
 const h=$('#hero');if(!h)return;h.classList.add('snap');goTo(0);void h.offsetWidth;h.classList.remove('snap');
 const run=()=>{clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)goTo(idx+1)},3200)};
 run();
 h.onpointerdown=e=>{drag=e.clientX;clearInterval(timer)};
 h.onpointerup=e=>{if(drag!==null&&Math.abs(e.clientX-drag)>40)goTo(idx+(e.clientX<drag?1:-1));drag=null;run()};
 h.onpointercancel=()=>{drag=null;run()}}
function stop(){clearInterval(timer)}

/* ================= AUTH + NOTIFICATIONS + EMAIL ================= */
const sb=(window.supabase&&!SUPABASE_URL.startsWith('YOUR_'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}}):null;
function badges(){const n=S.notifs.filter(x=>!x.r).length,b=$('#bb');if(b){b.hidden=!n;b.textContent=n>9?'9+':n}}
function notif(t,m){S.notifs.unshift({t,m,at:Date.now(),r:0});S.notifs=S.notifs.slice(0,50);store();badges();
 try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:m})}catch{}}
/* The server verifies the Supabase token and uses the VERIFIED email; the browser can never choose a recipient. */
async function mail(type){
 if(!U||!U.verified||!TOKEN)return false;
 try{const j=await callFn(MAIL_FN,{type,token:TOKEN});return !!j.ok}catch{return false}}
function loadState(){
 const saved=jget('kz_n_'+U.id,null);U.first=!saved;
 S=Object.assign(DEF(),saved||{});
 S.prefs=Object.assign({email:true,daily:true},S.prefs);
 S.wallet=Object.assign({bal:0,tx:[]},S.wallet);
 if(U.meta.email_daily===false)S.prefs.daily=false;else if(U.meta.email_daily===true)S.prefs.daily=true}
function welcome(){
 const fn=U.name.split(' ')[0];
 if(!sessionStorage.getItem('kz_w_'+U.id)){
  sessionStorage.setItem('kz_w_'+U.id,'1');
  if(U.first){notif('Welcome to KAMPZA 🧡','Hi '+fn+', your account is ready. Find It. Get It. Love It.');if(S.prefs.email)mail('welcome')}
  else{notif('Welcome back, '+fn+' 👋','Good to see you again. New campus deals are waiting.');if(S.prefs.email)mail('welcome')}
  toast((U.first?'Welcome to KAMPZA, ':'Welcome back, ')+fn+' 👋');
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch{}}
 if(S.day!==today()){S.day=today();notif('Today’s deals are live','Check Flash Deals on the home page for price drops.')}
 store();badges()}
async function session(){for(let i=0;i<3;i++){try{const{data}=await sb.auth.getSession();if(data.session)return data.session}catch{}await new Promise(r=>setTimeout(r,400))}return null}
async function boot(){
 if(!sb){nav();$('#app').innerHTML=empty('🔑','Add your Supabase URL and anon key in the CONFIG line to enable sign-in.');return}
 const ses=await session();
 if(!ses){if(!navigator.onLine){nav();$('#app').innerHTML=empty('📡','You are offline. Reconnect and reload.');return}location.replace(AUTH_URL);return}
 TOKEN=ses.access_token;const u=ses.user,md=u.user_metadata||{};
 U={id:u.id,email:u.email,verified:!!u.email_confirmed_at,
  name:md.full_name||md.name||(u.email||'').split('@')[0],
  phone:u.phone||md.phone||'',avatar:md.avatar_url||md.picture||'',meta:md};
 loadState();welcome();history.replaceState({root:1},'');draw();loadCatalog()}
/* Only the user's own Log Out signs them out. Other SIGNED_OUT events are re-checked first. */
sb?.auth.onAuthStateChange((ev,ses)=>{if(ses?.access_token)TOKEN=ses.access_token;
 if(ev==='SIGNED_OUT'&&U){if(OUT){sessionStorage.clear();location.replace(AUTH_URL)}else setTimeout(async()=>{if(!await session()){sessionStorage.clear();location.replace(AUTH_URL)}},800)}});
addEventListener('pageshow',async e=>{if(e.persisted&&sb&&U){const t=await session();if(t)TOKEN=t.access_token;else location.replace(AUTH_URL)}});
/* Back button moves inside the app and never leaves the store or the session. */
addEventListener('popstate',e=>{if(!U)return;const t=e.state;
 q='';$('#q').value='';
 if(!t||t.root){tab='home';sub=null;pg=null;prod=null;draw(true);return}
 tab=t.tab||'home';sub=t.sub||null;pg=t.pg||null;prod=t.prod||null;draw(false)});
boot();
</script>
</body>
</html>
