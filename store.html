<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAMPZA Store</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF7628;--c:#252525;--bg:#FFFFFF;--g:#F4F4F4;--m:#6b6b6b;--b:#e8e8e8;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root{color-scheme:light}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:400 14px/1.4 Inter,system-ui,sans-serif;color:var(--c);background:var(--bg);padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
h1,h2,h3{font-family:Sora,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:480px;margin:auto;padding:0 14px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding:8px 0 6px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:6px}
.logo img{height:34px;width:auto;display:block}
.logo b{display:block;font:700 21px/1 Sora;letter-spacing:.5px}.logo b i{color:var(--o);font-style:normal}
.logo small{display:block;font:600 10px Inter;margin-top:3px}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center}
.bell svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell span{position:absolute;top:1px;right:1px;background:var(--o);color:#fff;font:700 10px Inter;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--g);border:1px solid var(--b);border-radius:999px;padding:0 14px;margin-top:6px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;padding:10px 0;outline:0;font:inherit;font-size:14px;color:var(--c);min-width:0}
.search input::placeholder{color:var(--m)}
/* hero */
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin-top:12px;touch-action:pan-y;user-select:none}
.track{position:relative;height:160px}.snap .sl{transition:none!important}
.track.anim{transition:transform .7s cubic-bezier(.65,0,.35,1)}
.sl{position:absolute;inset:0;height:160px;transition:transform .7s cubic-bezier(.65,0,.35,1),opacity .7s;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.sl::after{content:"";position:absolute;right:-50px;top:-30px;width:200px;height:240px;background:var(--a);border-radius:45% 55% 40% 60%;transform:rotate(-18deg);opacity:.95}
.sl>*{position:relative;z-index:1}
.sl .t{color:var(--o);font:600 13px Inter}
.sl h2{font-size:19px;line-height:1.2;max-width:58%}
.sl .em{position:absolute;right:14px;top:50%;transform:translateY(-52%);font-size:64px;z-index:1;filter:drop-shadow(0 6px 10px #0006)}
.btn{background:var(--o);color:#fff;font-weight:600;border-radius:10px;padding:8px 14px;transition:transform .1s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.sl .btn{align-self:flex-start;margin-top:6px;font-size:13px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:3}
.dots i{width:6px;height:6px;border-radius:99px;background:#ffffff80;transition:.3s}
.dots i.on{background:#fff;width:16px}
/* categories */
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none;border-bottom:1px solid var(--b)}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 62px;text-align:center;font-size:11.5px}
.cat i{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#FF762818;font-size:24px;margin:0 auto 5px;font-style:normal;transition:transform .15s}
.cat:active i{transform:scale(.92)}
/* sections */
.sh{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.sh h2{font-size:17px}.sh a{color:var(--o);font-weight:600;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:1px solid var(--b);border-radius:var(--r);padding:8px;position:relative;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.pimg{height:96px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-size:46px}
.disc{position:absolute;top:10px;left:10px;background:var(--o);color:#fff;font:600 11px Inter;padding:2px 8px;border-radius:99px;z-index:1}
.hb{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:1}
.hb svg{width:17px;height:17px;fill:none;stroke:var(--c);stroke-width:2;transition:.2s}
.hb.on svg{fill:var(--o);stroke:var(--o);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
.card h3{font:500 13.5px Inter}
.pr{font-weight:700;font-size:15px}.old{color:var(--m);text-decoration:line-through;font-size:11px;font-weight:400;margin-left:4px}
.card .btn{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;padding:8px 6px}
.card .btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 130px;scroll-snap-align:start}
.row .pimg{height:84px;font-size:42px}
/* bottom nav */
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:456px;margin:auto;background:var(--bg);border:1px solid var(--b);border-radius:20px;box-shadow:0 6px 22px #00000026;z-index:30;padding:4px 2px}
nav div{max-width:480px;margin:auto;display:flex}
nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:5px 0;font:500 11px Inter;color:var(--m);position:relative}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
nav .on{color:var(--o);font-weight:600}nav .on svg{fill:var(--o)}
nav .cb{position:absolute;top:0;right:22%;background:var(--o);color:#fff;font:700 10px Inter;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.nt{padding:10px;border-radius:10px;border:1px solid var(--b);margin-bottom:8px}.nt.un{background:#FF762812;border-color:#FF762866}.nt small{color:var(--m)}
.soon{text-align:center;padding:70px 16px;color:var(--m)}.soon b{display:block;font-size:38px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#252525;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header><div class="wrap">
 <div class="hrow">
  <div class="logo">
   <img src="kampza-logo.png" alt="KAMPZA - Find It. Get It. Love It." onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'KAMPZA'}))">
   
  </div>
  <button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 8H4c0-1 2-2 2-8zM10 20a2 2 0 004 0"/></svg><span id="bb" hidden></span></button>
 </div>
 <form class="search" role="search" onsubmit="event.preventDefault();toast('Search comes in the next step')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="What are you looking for?" aria-label="Search products"></form>
</div></header>

<main class="wrap" id="app"></main>

<nav aria-label="Main"><div id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),fmt=n=>'₦'+n.toLocaleString('en-NG');
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2000)};

/* ---- data (swap for your API later) ---- */
const SLIDES=[
 ['New Arrivals','Better Choices. Brighter Days.','🎧','#FF7628'],
 ['Campus Essentials','Everything You Need, Closer.','🎒','#e8590c'],
 ['Special Deals','More Finds. Smarter Shopping.','🏷️','#ff9142'],
 ['Everyday Lifestyle','Your Campus. Your Marketplace.','👟','#d9480f'],
 ['Tech Picks','Power Up Your Study Game.','💻','#ff6a00']];
const CATS=[['Electronics','💻'],['Fashion','👕'],['Home & Living','🏠'],['Beauty','💄'],['Appliances','🧺'],['Groceries','🛒'],['Sports','⚽'],['Books','📚'],['Campus','🎒']];
const DEALS=[['Wireless Earbuds','🎧',29990,37500],['Smart Watch','⌚',49990,58000]];
const REC=[['Smartphone','📱',420000],['Canvas Sneakers','👟',24000],['Tote Handbag','👜',15500],['Headphones','🎧',35000],['Power Bank','🔋',21000]];
const wish=new Set();let cart=0;

/* ---- icons ---- */
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/></svg>';
const cartI='<svg viewBox="0 0 24 24"><path d="M3 4h3l2.5 12h10L21 8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>';
const IC={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',cats:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',wish:'<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.5-8 11-8 11z"/>',cart:'<path d="M3 4h3l2.5 12h10L21 8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const NAV=[['home','Home'],['cats','Categories'],['wish','Wishlist'],['cart','Cart'],['account','Account']];

/* ---- views ---- */
const slide=s=>`<section class="sl" style="--a:var(--o);background:#252525"><span class="t">${s[0]}</span><h2>${s[1]}</h2><span class="em" aria-hidden="true">${s[2]}</span><button class="btn" onclick="toast('Shop page comes next')">Shop Now →</button></section>`;
const deal=(d,i)=>`<article class="card"><span class="disc">-${Math.round((1-d[2]/d[3])*100)}%</span><button class="hb ${wish.has('d'+i)?'on':''}" data-w="d${i}" aria-label="Wishlist ${d[0]}">${heart}</button><div class="pimg">${d[1]}</div><h3>${d[0]}</h3><div class="pr">${fmt(d[2])}<span class="old">${fmt(d[3])}</span></div><button class="btn" data-add>${cartI}Add to Cart</button></article>`;
const rec=(d,i)=>`<article class="card"><button class="hb ${wish.has('r'+i)?'on':''}" data-w="r${i}" aria-label="Wishlist ${d[0]}">${heart}</button><div class="pimg">${d[1]}</div><h3>${d[0]}</h3><div class="pr">${fmt(d[2])}</div></article>`;
function home(){return `
<div class="hero" id="hero" aria-roledescription="carousel" aria-label="Campaigns"><div class="track" id="track">${SLIDES.map(slide).join('')}</div><div class="dots">${SLIDES.map(()=>'<i></i>').join('')}</div></div>
<div class="cats">${CATS.map(c=>`<button class="cat" onclick="toast('${c[0]} page comes next')"><i>${c[1]}</i>${c[0]}</button>`).join('')}</div>
<div class="sh"><h2>Flash Deals</h2><a>View All →</a></div><div class="grid">${DEALS.map(deal).join('')}</div>
<div class="sh"><h2>Recommended For You</h2><a>View All →</a></div><div class="row">${REC.map(rec).join('')}</div>`}
const soon=n=>`<div class="soon"><b>🚧</b>${n} page is coming in the next step.</div>`;

/* ---- nav + router ---- */
let tab='home';
function draw(){
 $('#nav').innerHTML=NAV.map(n=>`<button data-t="${n[0]}" class="${n[0]==tab?'on':''}" aria-label="${n[1]}" ${n[0]==tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[n[0]]}</svg>${n[1]}${n[0]=='cart'&&cart?`<span class="cb">${cart}</span>`:''}</button>`).join('');
 stop();
 $('#app').innerHTML=tab=='home'?home():tab=='notifs'?notifsView():soon(NAV.find(n=>n[0]==tab)[1]);
 scrollTo(0,0);if(tab=='home')start();
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b&&b.dataset.t!=tab){tab=b.dataset.t;draw()}};
document.addEventListener('click',e=>{
 const w=e.target.closest('[data-w]');if(w){const k=w.dataset.w;wish.has(k)?wish.delete(k):wish.add(k);w.classList.toggle('on');toast(wish.has(k)?'Saved to wishlist':'Removed from wishlist')}
 if(e.target.closest('[data-add]')){cart++;toast('Added to cart');const c=$('nav .cb');if(c)c.textContent=cart;else draw()}
});

/* ---- hero: continuous, looping slide animation ---- */
let idx=0,timer,drag=null;const N=SLIDES.length;
function go(i){if(!$('#track'))return;idx=((i%N)+N)%N;document.querySelectorAll('.sl').forEach((s,j)=>{let o=((j-idx)%N+N)%N;if(o>N/2)o-=N;s.style.transform=`translateX(${o*100}%)`;s.style.opacity=Math.abs(o)>1?0:1;s.setAttribute('aria-hidden',o!==0)});
 document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j==idx))}
function next(d=1){
 
 go(idx+d)}
function start(){
 const h=$('#hero');h.classList.add('snap');go(0);void h.offsetWidth;h.classList.remove('snap');
 
 const run=()=>{clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)next(1)},3200)};
 run();
 h.onpointerdown=e=>{drag=e.clientX;clearInterval(timer)};
 h.onpointerup=e=>{if(drag!==null&&Math.abs(e.clientX-drag)>40)next(e.clientX<drag?1:-1);drag=null;run()};
 h.onpointercancel=()=>{drag=null;run()};
}
function stop(){clearInterval(timer)}
/* ---- auth + notifications + welcome email ---- */
const SUPABASE_URL='YOUR_SUPABASE_URL',SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY',AUTH_URL='index.html',MAIL_ENDPOINT='notify.php';
const sb=(window.supabase&&!SUPABASE_URL.startsWith('YOUR_'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=null,S={notifs:[],prefs:{email:true}};
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const store=()=>{try{U&&localStorage.setItem('kz_n_'+U.id,JSON.stringify(S))}catch{}};
function badges(){const n=S.notifs.filter(x=>!x.r).length,b=$('#bb');if(b){b.hidden=!n;b.textContent=n>9?'9+':n}}
function notif(t,m){S.notifs.unshift({t,m,at:Date.now(),r:0});store();badges();
 try{if('Notification' in window&&Notification.permission==='granted')new Notification(t,{body:m})}catch{}}
async function mail(type,extra={}){
 if(!U||!U.verified)return; /* only confirmed emails receive mail */
 if(type.indexOf('welcome')!==0&&!S.prefs.email)return;
 try{const r=await fetch(MAIL_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,name:U.name,email:U.email,...extra})});const j=await r.json();if(!j.ok)toast('Email not sent: '+(j.error||'server error'))}
 catch{console.warn('Upload notify.php next to this file')}}
function welcome(){
 const k='kz_n_'+U.id,first=!localStorage.getItem(k);S=jget(k,null)||{notifs:[],prefs:{email:true}};
 if(sessionStorage.getItem('kz_w_'+U.id)){badges();return}
 sessionStorage.setItem('kz_w_'+U.id,'1');
 const fn=U.name.split(' ')[0];
 if(first){notif('Today\u2019s deals are live','Check Flash Deals on the home page for price drops.');notif('Welcome to KAMPZA 🧡','Hi '+fn+', your account is ready. Find It. Get It. Love It.');mail('welcome_new')}
 else{notif('Welcome back, '+fn+' 👋','Good to see you again. New campus deals are waiting.');mail('welcome_back')}
 toast((first?'Welcome to KAMPZA, ':'Welcome back, ')+fn+' 👋');
 try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch{}}
function notifsView(){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><h1 style="font-size:20px">Notifications</h1><button class="btn" style="background:var(--g);color:var(--c)" data-read>Mark all as read</button></div><div style="margin-top:12px">${S.notifs.length?S.notifs.map(n=>`<div class="nt ${n.r?'':'un'}"><b>${esc(n.t)}</b><div>${esc(n.m)}</div><small>${new Date(n.at).toLocaleString()}</small></div>`).join(''):'<div class="soon"><b>🔔</b>No notifications yet.</div>'}</div>`}
$('#bell').onclick=()=>{tab='notifs';draw()};
document.addEventListener('click',e=>{if(e.target.closest('[data-read]')){S.notifs.forEach(n=>n.r=1);store();badges();draw()}});
async function boot(){
 let u=null;
 if(sb){try{u=(await sb.auth.getSession()).data.session?.user}catch{}if(!u){location.replace(AUTH_URL);return}}
 else u={id:'demo',email:'demo@kampza.com',email_confirmed_at:null,user_metadata:{full_name:'Dan'}}; /* preview mode until Supabase keys are set */
 const md=u.user_metadata||{};
 U={id:u.id,email:u.email,verified:!!u.email_confirmed_at,name:md.full_name||md.name||u.email.split('@')[0]};
 welcome();draw()}
sb?.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){U=null;sessionStorage.clear();location.replace(AUTH_URL)}});
boot();
</script>
</body>
</html>
